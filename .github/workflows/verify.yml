name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run vendor:fonts
      - run: git diff --exit-code -- assets/fonts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run test:e2e
      - run: npm run test:deploy
      - run: npm run build:static
      - run: |
          docker run --rm \
            -v "$PWD/deploy/nginx/canranstudio-http.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284 nginx -t
