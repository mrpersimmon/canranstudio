name: verify

on:
  push:
    branches: [main, codex/release-canranstudio]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:workflow
      - run: node scripts/ci/browser-suite.js verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: test-inventories
          path: output/ci/inventory-*/
          retention-days: 7
      - run: npm run vendor:fonts
      - run: git diff --exit-code -- assets/fonts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run test:deploy
      - run: npm run build:login
      - run: |
          docker run --rm \
            -v "$PWD/deploy/nginx/canranstudio-http.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284 nginx -t

  courses:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Keep serial files together; live discovery covers new files as well.
      - run: node scripts/ci/browser-suite.js run courses ${{ matrix.shard }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: courses-${{ matrix.shard }}
          path: output/ci/courses-${{ matrix.shard }}/
          retention-days: 7

  cache-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Cold-load and warm-revisit budgets use separate browser processes; do
      # not mix them with the repeated reload and fault-injection stress tests.
      - run: npx playwright test tests/e2e/course-cache-cold.spec.js --grep @cache-performance --trace=off --reporter=line,json --output=output/ci/cache-cold/results
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: output/ci/cache-cold/report.json
      - run: npx playwright test tests/e2e/course-cache-performance.spec.js --grep @cache-performance --reporter=line,json --output=output/ci/cache-revisit/results
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: output/ci/cache-revisit/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cache-performance
          path: output/ci/cache-*/
          retention-days: 7

  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/ci/browser-suite.js run accounts ${{ matrix.shard }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: accounts-${{ matrix.shard }}
          path: output/ci/accounts-${{ matrix.shard }}/
          retention-days: 7

  recovery-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        base: ['/', '/lesson/']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run test:recovery:webkit -- --reporter=line,json
        env:
          AWARD_TEST_BASE: ${{ matrix.base }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: output/ci/webkit-recovery.json
      - run: npm run test:statistics -- --project=webkit-phone --reporter=line,json
        env:
          AWARD_TEST_BASE: ${{ matrix.base }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: output/ci/webkit-statistics.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recovery-webkit-${{ strategy.job-index }}
          path: |
            output/ci/webkit-*.json
            output/test-recovery-webkit/
            output/test-statistics/
          retention-days: 7

  test:
    # Keep one stable required check. A failed, cancelled, or skipped upstream
    # job must never turn the PR green.
    if: always()
    needs: [foundation, courses, accounts, cache-performance, recovery-webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci/browser-suite.js gate
