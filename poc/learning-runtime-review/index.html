<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>暖灯风味市集 · 学习运行时验收台</title>
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/poc/learning-runtime-review/review.css">
</head>
<body>
  <main
    class="review-shell"
    data-learning-review-root
    data-beat="discover"
    data-state="ready"
    data-viewport="iphone12"
    data-microstep="task"
    data-motion="full"
    data-immersive="false"
    data-runtime-status="idle"
    data-runtime-build-stage="0"
    data-runtime-support-level="0"
  >
    <header class="review-controls" data-review-controls>
      <div class="review-heading">
        <div>
          <p class="review-kicker">内部验收 · 不写入孩子进度</p>
          <h1>暖灯风味市集学习剧场</h1>
        </div>
        <button class="immersive-button" type="button" data-immersive-toggle>
          <span aria-hidden="true">⛶</span> 进入孩子全屏
        </button>
      </div>

      <div class="control-deck">
        <fieldset class="control-group control-group--beats">
          <legend>五幕</legend>
          <div class="segmented" data-beat-controls role="toolbar" aria-label="选择五幕">
            <button type="button" data-value="discover">1 发现问题</button>
            <button type="button" data-value="understand">2 听懂线索</button>
            <button type="button" data-value="teach">3 教会小猫</button>
            <button type="button" data-value="transfer">4 换个情境</button>
            <button type="button" data-value="build">5 建造地标</button>
          </div>
        </fieldset>

        <fieldset class="control-group control-group--state">
          <legend>任务状态</legend>
          <div class="segmented segmented--compact" data-state-controls role="toolbar" aria-label="选择任务状态">
            <button type="button" data-value="ready">待作答</button>
            <button type="button" data-value="correct">正确</button>
            <button type="button" data-value="first-error">首次错误</button>
            <button type="button" data-value="partial-cue">局部线索</button>
            <button type="button" data-value="model">示范</button>
            <button type="button" data-value="near-transfer">近迁移</button>
            <button type="button" data-value="storage-failure">存储失败</button>
          </div>
        </fieldset>

        <fieldset class="control-group control-group--microstep">
          <legend>微步骤</legend>
          <div class="segmented segmented--compact" data-microstep-controls role="toolbar" aria-label="选择微步骤">
            <button type="button" data-value="task">任务</button>
            <button type="button" data-value="audio-waiting">等待读音</button>
            <button type="button" data-value="audio-playing">读音播放中</button>
            <button type="button" data-value="audio-completed">读音完成</button>
            <button type="button" data-value="audio-fallback">无声替代</button>
          </div>
        </fieldset>

        <fieldset class="control-group control-group--viewport">
          <legend>设备画幅</legend>
          <div class="segmented segmented--compact" data-viewport-controls role="toolbar" aria-label="选择设备画幅">
            <button type="button" data-value="iphone12">iPhone 12</button>
            <button type="button" data-value="huawei">华为大屏</button>
            <button type="button" data-value="tablet">常用平板</button>
            <button type="button" data-value="desktop">电脑</button>
          </div>
        </fieldset>

        <fieldset class="control-group control-group--motion">
          <legend>动效偏好</legend>
          <div class="segmented segmented--compact" data-motion-controls role="toolbar" aria-label="选择动效偏好">
            <button type="button" data-value="full">完整动效</button>
            <button type="button" data-value="reduced">减少动效</button>
          </div>
        </fieldset>
      </div>
    </header>

    <section class="preview-bay" aria-label="孩子端画面预览">
      <div class="device-frame" data-device-frame>
        <article class="child-scene" data-child-scene data-scene-mode="task">
          <header class="scene-header">
            <button type="button" class="scene-back" aria-label="返回地图">←</button>
            <button class="scene-back immersive-exit" type="button" data-immersive-exit aria-label="退出孩子全屏">×</button>
            <div class="scene-title">
              <span>暖灯风味市集</span>
              <strong data-scene-title>发现问题</strong>
            </div>
            <ol class="beat-progress" aria-label="五幕建设进度" data-beat-progress>
              <li><span>1</span></li>
              <li><span>2</span></li>
              <li><span>3</span></li>
              <li><span>4</span></li>
              <li><span>5</span></li>
            </ol>
          </header>

          <div class="scene-world">
            <div class="lantern-glow" aria-hidden="true"></div>
            <picture class="market-landmark">
              <source data-landmark-source srcset="/assets/adventure-map/lesson49/states/state-0-768.avif" type="image/avif">
              <img data-landmark-image src="/assets/adventure-map/lesson49/states/state-0-768.webp" alt="暖灯风味市集逻辑示意">
            </picture>
            <div class="proof-label">逻辑示意素材 · 非最终 U01 美术</div>

            <div class="adventurer" aria-hidden="true">
              <img class="adventurer__cat" src="/assets/adventure-map/mascot/explorer-cat-walking-route-page-20260806-01-192.webp" alt="">
              <img class="adventurer__flag" src="/assets/adventure-map/mascot/explorer-flag-purple-gold-route-page-20260806-01-96.webp" alt="">
            </div>

            <section class="mission-card">
              <p class="mission-eyebrow" data-mission-eyebrow>订单板 · 第一步</p>
              <h2 data-mission-title>这张订单还缺什么？</h2>
              <p data-mission-copy>先找出“谁要什么、不要什么、数量多少”里没有说清楚的线索。</p>
              <div class="audio-status" data-audio-status hidden>
                <span class="audio-status__icon" aria-hidden="true">♪</span>
                <span data-audio-status-copy>等待播放</span>
              </div>
              <div class="model-panel" data-model-panel hidden>
                <strong>小猫示范</strong>
                <ol>
                  <li>先认出线索属于哪一类</li>
                  <li>再说明为什么要放进这个抽屉</li>
                </ol>
              </div>
              <div class="feedback-strip" data-feedback role="status" aria-live="polite" aria-atomic="true" hidden></div>
            </section>
          </div>

          <footer class="action-tray" data-action-tray>
            <p class="action-hint" data-action-hint>点选一张还需要问清楚的线索</p>
            <div class="answer-grid" data-answer-grid>
              <button type="button" data-answer="person"><b>谁</b><span>是哪位客人？</span></button>
              <button type="button" data-answer="item"><b>什么</b><span>需要哪种食材？</span></button>
              <button type="button" data-answer="quantity"><b>多少</b><span>需要几份？</span></button>
            </div>
          </footer>
        </article>
      </div>
    </section>

  </main>

  <script src="/core/curriculum-catalog.js"></script>
  <script src="/core/learning-store.js"></script>
  <script src="/core/learning-ledger.js"></script>
  <script src="/core/learning-runtime.js"></script>
  <script src="/poc/learning-runtime-review/review.js"></script>
</body>
</html>
