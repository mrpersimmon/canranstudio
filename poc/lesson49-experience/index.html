<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#3a2419">
  <title>学习冒险</title>
  <link rel="icon" href="/assets/home/lesson49-steak.png">
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/poc/lesson49-experience/experience.css">
</head>
<body>
  <main
    class="experience"
    data-lesson49-experience
    data-view="arrival"
    data-runtime-beat="none"
    data-build-stage="0"
    data-support-level="0"
  >
    <header class="story-header">
      <a
        class="map-back"
        href="/?district=first-book-49-60&amp;focus=lesson49"
        aria-label="返回学习地图"
      >←</a>
      <div class="story-title">
        <span data-lesson-label></span>
        <strong data-header-title></strong>
      </div>
      <div class="build-meter" aria-label="地标成长进度">
        <span>地标成长</span>
        <strong><b data-stage-number>0</b> / 5</strong>
      </div>
    </header>

    <section class="world" aria-live="off">
      <div class="sunwash" aria-hidden="true"></div>
      <div class="route-line" aria-hidden="true"></div>

      <figure class="landmark" aria-label="正在建设的学习地标">
        <div class="landmark-glow" aria-hidden="true"></div>
        <picture>
          <source
            data-landmark-source
            type="image/avif"
            srcset="/assets/adventure-map/lesson49/states/state-0-768.avif"
          >
          <img
            data-landmark-image
            src="/assets/adventure-map/lesson49/states/state-0-768.webp"
            alt="还没有开始建设的学习地标"
            width="768"
            height="768"
          >
        </picture>
      </figure>

      <div class="explorer" aria-hidden="true">
        <img
          class="explorer__flag"
          src="/assets/adventure-map/mascot/explorer-flag-purple-gold-route-page-20260806-01-96.webp"
          alt=""
        >
        <img
          class="explorer__cat"
          src="/assets/adventure-map/mascot/explorer-cat-walking-route-page-20260806-01-192.webp"
          alt=""
        >
      </div>

      <section class="arrival-panel" data-arrival>
        <p class="panel-kicker" data-arrival-kicker></p>
        <h1 data-arrival-title></h1>
        <p data-arrival-copy></p>
        <div class="arrival-promises" data-arrival-promises aria-label="本次冒险内容"></div>
        <button class="start-button" type="button" data-start-adventure></button>
      </section>

      <section class="mission-panel" data-mission hidden>
        <p class="mission-step" data-mission-step>第一幕 · 发现问题</p>
        <p class="mission-eyebrow" data-mission-eyebrow>肉铺订单</p>
        <h1 data-mission-title>订单还缺哪条线索？</h1>
        <p class="mission-copy" data-mission-copy></p>

        <ul class="scene-items" data-scene-items hidden></ul>

        <div class="audio-mission" data-audio-mission hidden>
          <button class="audio-button" type="button" data-audio-play>
            <span class="audio-button__icon" aria-hidden="true">▶</span>
            <span data-audio-label>播放完整对话</span>
          </button>
          <span class="audio-speaker" data-audio-speaker hidden></span>
          <div class="sound-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        </div>

        <div class="audio-fallback" data-audio-fallback hidden>
          <strong>声音暂时没有播放</strong>
          <div data-audio-fallback-copy></div>
        </div>

        <div class="model-card" data-model-card hidden>
          <div class="model-card__cat" aria-hidden="true">猫</div>
          <div>
            <strong>小猫示范的是方法</strong>
            <ol data-model-steps></ol>
          </div>
        </div>

        <p class="feedback" data-feedback role="status" aria-live="polite" aria-atomic="true" hidden></p>
      </section>

      <section class="complete-panel" data-lesson-complete hidden>
        <p class="panel-kicker" data-complete-kicker></p>
        <h1 data-complete-title></h1>
        <div class="completion-seal" aria-label="地标成长二级，共五级">
          <span>地标成长</span>
          <strong><b data-complete-stage>0</b> / 5</strong>
        </div>
        <p data-complete-copy></p>
        <div class="complete-actions">
          <a data-continue-lesson href="/"></a>
          <a data-map-return href="/"></a>
          <button type="button" data-replay></button>
        </div>
      </section>
    </section>

    <footer class="response-dock" data-response-dock hidden>
      <p data-response-hint></p>
      <div class="response-fields" data-response-fields></div>
      <button class="submit-response" type="button" data-submit-response></button>
    </footer>

    <button
      class="growth-reveal"
      type="button"
      data-growth-reveal
      aria-label="关闭地标成长提示并继续"
      hidden
    >
      <div class="growth-reveal__wash" aria-hidden="true"></div>
      <div class="growth-reveal__art" aria-hidden="true">
        <picture class="growth-reveal__before">
          <source data-growth-before-source type="image/avif">
          <img data-growth-before alt="">
        </picture>
        <picture class="growth-reveal__after">
          <source data-growth-after-source type="image/avif">
          <img data-growth-after alt="">
        </picture>
      </div>
      <div class="growth-reveal__message">
        <span data-growth-step></span>
        <strong data-growth-title></strong>
        <p data-growth-copy></p>
        <small>轻触任意位置继续</small>
      </div>
    </button>

    <section class="fatal-card" data-fatal hidden>
      <h1>这段冒险暂时没有准备好</h1>
      <p>请刷新页面后再试一次。</p>
    </section>
  </main>

  <script src="/core/curriculum-catalog.js"></script>
  <script src="/core/learning-store.js"></script>
  <script src="/core/learning-ledger.js"></script>
  <script src="/core/learning-runtime.js"></script>
  <script src="/core/audio-player.js"></script>
  <script src="/core/learning-scene.js"></script>
  <script src="/poc/lesson49-experience/experience.js"></script>
</body>
</html>
