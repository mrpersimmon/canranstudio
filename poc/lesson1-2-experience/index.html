<body>
  <main data-learning-microtask-experience>
    <section class="experience-startup" data-experience-startup data-startup-state="loading" role="status" aria-live="polite">
      <div class="experience-startup__beacon" aria-hidden="true"><span>★</span><i></i></div>
      <p class="experience-startup__kicker">LEARNING ADVENTURE</p>
      <h1>学习冒险正在准备</h1>
      <p>正在整理人物、声音和任务，很快就好。</p>
      <a class="experience-startup__reload" data-startup-reload href="?v=lesson1-2-v2-20260830-r6">长时间没有出现？重新加载</a>
    </section>
  </main>
  <script data-entry-rescue>
    (function lessonOneTwoEntryRescue() {
      'use strict';
      const root = document.querySelector('[data-learning-microtask-experience]');
      if (!root) return;
      let recoveryRequested = false;
      root.addEventListener('click', event => {
        const startButton = event.target.closest?.('button[data-action="start"]');
        if (!startButton || !root.contains(startButton)) return;
        const beforeClick = root.innerHTML;
        globalThis.setTimeout(() => {
          if (recoveryRequested || root.innerHTML !== beforeClick) return;
          recoveryRequested = true;
          globalThis.location?.replace?.('?v=lesson1-2-v2-20260830-r6&recover=entry-noop');
        }, 0);
      }, true);
    })();
  </script>
