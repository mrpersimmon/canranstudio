<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="same-origin">
  <title>地标验收台 · 灿然英语小镇</title>
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/poc/landmark-review/landmark-review.css">
</head>
<body>
  <div class="review-shell" data-review-root>
    <header class="review-controls" aria-label="地标验收控制台">
      <div class="location-row">
        <button class="round-step" type="button" data-location-step="previous" aria-label="上一个地标">←</button>
        <label class="location-picker-wrap">
          <span class="visually-hidden">选择地图地点</span>
          <select class="location-picker" data-location-picker aria-label="选择地图地点"></select>
        </label>
        <button class="round-step" type="button" data-location-step="next" aria-label="下一个地标">→</button>
      </div>
      <div class="control-ledger">
        <div class="segmented" data-review-tabs aria-label="审查类型"></div>
        <div class="segmented" data-viewport-tabs aria-label="观察尺寸">
          <button type="button" data-viewport-button="iphone">iPhone 12</button>
          <button type="button" data-viewport-button="huawei">华为窄屏</button>
          <button type="button" data-viewport-button="tablet">常用平板</button>
          <button type="button" data-viewport-button="desktop">电脑摊页</button>
          <button type="button" data-viewport-button="master">美术原图</button>
        </div>
      </div>
      <div class="scenario-panel" data-scenario-panel hidden>
        <span>验收进度</span>
        <div class="segmented" data-scenario-tabs aria-label="孩子端进度场景">
          <button type="button" data-scenario-button="journey">闯关中</button>
          <button type="button" data-scenario-button="initial">全部初始</button>
          <button type="button" data-scenario-button="complete">全部完成</button>
        </div>
      </div>
      <section class="preload-status" data-review-preload-status data-state="idle" aria-live="polite">
        <div class="preload-summary">
          <strong>资源准备 <span data-review-preload-count>0/0</span></strong>
          <span data-review-preload-detail>等待当前图片</span>
        </div>
        <progress data-review-preload-progress value="0" max="1">0%</progress>
        <div class="preload-actions">
          <button type="button" data-review-recheck aria-label="重新验证当前地标">冷缓存复验</button>
          <button type="button" data-review-retry hidden>重试失败项</button>
        </div>
      </section>
    </header>

    <main class="review-workspace">
      <div class="review-frame" data-review-frame></div>
    </main>

    <nav class="stage-strip" data-stage-strip aria-label="地标阶段"></nav>
  </div>
  <noscript>此验收台需要启用 JavaScript。</noscript>
  <script src="/core/course-catalog.js"></script>
  <script src="/core/adventure-atlas.js"></script>
  <script src="/poc/landmark-review/landmark-review.js"></script>
  <script>CanranPoc.landmarkReview.mount(document.querySelector('[data-review-root]'));</script>
</body>
</html>
