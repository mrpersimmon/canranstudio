<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="same-origin">
  <title>四季生活城 · 纪念章验收</title>
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <link rel="stylesheet" href="/poc/keepsake-review/keepsake-review.css">
</head>
<body>
  <main class="keepsake-shell" data-keepsake-root data-state="stage2">
    <article class="keepsake-book" aria-label="四季生活城纪念章收藏册">
      <header class="book-header">
        <button class="back-button" type="button" data-back aria-label="返回">
          <img src="/poc/keepsake-review/assets/back-button.png" alt="">
        </button>
        <h1>四季生活城<span>· 纪念章</span></h1>
      </header>

      <div class="book-pages">
        <section class="stage-page" aria-label="阶段纪念章">
          <img class="converging-ribbons" src="/poc/keepsake-review/assets/converging-ribbons-1024.webp" alt="" aria-hidden="true">

          <ol class="stage-list">
            <li class="stage-slot stage-slot--one" data-stage-slot="1">
              <button class="badge-button" type="button" data-badge="stage1" aria-label="丰盛餐桌纪念章，已获得">
                <span class="badge-art-wrap">
                  <img class="badge-art" src="/poc/keepsake-review/assets/badge-abundant-table-768.webp" data-color-src="/poc/keepsake-review/assets/badge-abundant-table-768.webp" data-embossed-src="/poc/keepsake-review/assets/badge-abundant-table-embossed-768.webp" alt="丰盛餐桌纪念章">
                </span>
                <span class="earned-assembly">
                  <img class="earned-frame" data-earned-frame src="/poc/keepsake-review/assets/earned-badge-frame-v2-768.webp" alt="" aria-hidden="true">
                  <span class="earned-ribbon-copy">已获得</span>
                  <span class="earned-inscription">丰盛餐桌的奉献</span>
                </span>
                <span class="badge-caption">丰盛餐桌的奉献</span>
              </button>
            </li>
            <li class="stage-slot stage-slot--two" data-stage-slot="2">
              <button class="badge-button" type="button" data-badge="stage2" aria-label="四季罗盘纪念章，当前目标">
                <span class="badge-art-wrap">
                  <img class="badge-art" src="/poc/keepsake-review/assets/badge-four-seasons-compass-embossed-768.webp" data-color-src="/poc/keepsake-review/assets/badge-four-seasons-compass-768.webp" data-embossed-src="/poc/keepsake-review/assets/badge-four-seasons-compass-embossed-768.webp" alt="四季罗盘纪念章">
                </span>
                <span class="earned-assembly">
                  <img class="earned-frame" data-earned-frame src="/poc/keepsake-review/assets/earned-badge-frame-v2-768.webp" alt="" aria-hidden="true">
                  <span class="earned-ribbon-copy">已获得</span>
                  <span class="earned-inscription">让四季住进罗盘</span>
                </span>
                <span class="badge-caption">让四季住进罗盘</span>
              </button>
            </li>
            <li class="stage-slot stage-slot--three" data-stage-slot="3">
              <button class="badge-button" type="button" data-badge="stage3" aria-label="世界气候旅程纪念章，尚未解锁">
                <span class="badge-art-wrap">
                  <img class="badge-art" src="/poc/keepsake-review/assets/badge-world-climate-journey-embossed-768.webp" data-color-src="/poc/keepsake-review/assets/badge-world-climate-journey-768.webp" data-embossed-src="/poc/keepsake-review/assets/badge-world-climate-journey-embossed-768.webp" alt="世界气候旅程纪念章">
                </span>
                <span class="earned-assembly">
                  <img class="earned-frame" data-earned-frame src="/poc/keepsake-review/assets/earned-badge-frame-v2-768.webp" alt="" aria-hidden="true">
                  <span class="earned-ribbon-copy">已获得</span>
                  <span class="earned-inscription">风吹过远方的地图</span>
                </span>
                <span class="badge-caption clue-caption">神秘线索：<br>风吹过远方的地图</span>
              </button>
            </li>
          </ol>

          <aside class="progress-plaque" data-progress-plaque aria-live="polite">
            <div class="progress-row">
              <img class="progress-mark" src="/poc/keepsake-review/assets/progress-star.png" alt="" aria-hidden="true">
              <span data-star-label>本城挑战星</span>
              <strong data-star-value>8/12</strong>
            </div>
            <div class="progress-row">
              <img class="progress-mark" src="/poc/keepsake-review/assets/progress-footprint.png" alt="" aria-hidden="true">
              <span data-footprint-label>地标足迹</span>
              <strong data-footprint-value>4/6</strong>
            </div>
          </aside>
        </section>

        <section class="final-page" aria-label="城区终章纪念章">
          <button class="final-badge" type="button" data-badge="final" aria-label="四季生活城终章纪念章，地标落成六座，共十二座">
            <span class="final-art-wrap">
              <img class="final-art" src="/poc/keepsake-review/assets/badge-city-final-crest-embossed-1024.webp" data-color-src="/poc/keepsake-review/assets/badge-city-final-crest-1024.webp" data-embossed-src="/poc/keepsake-review/assets/badge-city-final-crest-embossed-1024.webp" alt="四季生活城终章纪念章">
            </span>
            <span class="final-progress" data-final-progress>地标落成 6/12</span>
          </button>
          <p class="final-whisper" data-final-whisper>三段旅程将在城区中心汇成一枚终章</p>
        </section>
      </div>

      <div class="book-spine" aria-hidden="true"></div>
    </article>

    <nav class="review-dock" data-review-dock aria-label="纪念章验收状态">
      <span>验收状态</span>
      <button type="button" data-review-state="start">初始</button>
      <button type="button" data-review-state="stage1">阶段一</button>
      <button type="button" data-review-state="stage2" aria-pressed="true">阶段二</button>
      <button type="button" data-review-state="stage3">阶段三</button>
      <button type="button" data-review-state="complete">终章</button>
    </nav>

    <section class="badge-dialog" data-badge-dialog hidden aria-modal="true" role="dialog" aria-labelledby="badge-dialog-title">
      <button class="dialog-dismiss" type="button" data-dialog-dismiss aria-label="关闭纪念章说明"></button>
      <div class="dialog-card">
        <p class="dialog-kicker" data-dialog-kicker>城区纪念章</p>
        <h2 id="badge-dialog-title" data-dialog-title></h2>
        <p data-dialog-copy></p>
        <span>点击任意位置继续</span>
      </div>
    </section>
  </main>

  <noscript>此纪念章验收页需要启用 JavaScript。</noscript>
  <script src="/poc/keepsake-review/keepsake-review.js"></script>
</body>
</html>
