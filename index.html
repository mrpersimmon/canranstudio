<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f2018">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="十二城区冒险图鉴">
<link rel="icon" type="image/png" href="/assets/home/park-tent.png">
<title>十二城区冒险图鉴 · 灿然英语小镇</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
:root{
  --ink:#493126;--ink-soft:#765b45;--paper:#f7e7bf;--paper-light:#fff5d7;
  --red:#a54332;--gold:#f4c44f;--purple:#7450a8;--blue:#276d9d;--green:#4c855f;
  --shadow:0 7px 0 rgba(65,39,25,.48);--safe-top:env(safe-area-inset-top);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;min-width:320px;color:var(--ink);background:#20140f;
  font:700 16px/1.45 'Baloo 2','ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button,a{-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:5px solid #176da0;outline-offset:5px}
.atlas-app{min-height:100dvh}

/* Shared atlas chrome */
.settings-bookmark{
  position:absolute;z-index:50;top:max(15px,calc(var(--safe-top) + 8px));right:clamp(13px,4vw,34px);
  display:grid;place-items:center;width:56px;height:58px;padding:0;border:3px solid var(--ink);border-radius:8px 8px 18px 18px;
  background:#8b3d31;color:#fff4d7;box-shadow:0 5px 0 rgba(57,32,21,.55);font-size:12px;
}
.settings-bookmark::after{content:"";position:absolute;bottom:-1px;border-inline:10px solid transparent;border-bottom:8px solid #f1d39a}
.settings-bookmark:hover{transform:translateY(-2px)}

/* World overview: one coloured, real entrance inside a fold-out explorer's book. */
.world-overview{position:relative;min-height:100dvh;padding:clamp(14px,3vw,30px)}
.world-book{
  position:relative;overflow:hidden;width:min(1120px,100%);min-height:calc(100dvh - clamp(28px,6vw,60px));margin:auto;
  border:5px solid #3c281e;border-radius:25px;background:
    radial-gradient(circle at 10px 11px,rgba(108,72,40,.09) 0 2px,transparent 2.5px) 0 0/28px 28px,
    linear-gradient(100deg,transparent 49.5%,rgba(80,49,29,.16) 49.8%,rgba(255,255,255,.27) 50.3%,transparent 50.7%),
    linear-gradient(145deg,#f9ebc8,#ead09d);
  box-shadow:0 18px 45px rgba(0,0,0,.45),inset 0 0 0 9px rgba(255,250,224,.4);isolation:isolate;
}
.world-book::after{content:"";position:absolute;inset:10px;border:2px dashed rgba(87,57,37,.33);border-radius:17px;pointer-events:none}
.world-mast{position:relative;z-index:4;display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:clamp(24px,5vw,48px) clamp(24px,6vw,68px) 8px}
.world-brand{max-width:610px;transform:rotate(-1deg)}
.world-kicker{margin:0;color:#955034;font-size:13px;letter-spacing:2px}
.world-brand h1{margin:2px 0 0;font-size:clamp(34px,7vw,72px);line-height:.98;color:#8e3c2d;text-shadow:0 2px #ffeebf}
.world-brand p:last-child{display:inline-block;margin:10px 0 0;padding:4px 15px;border-radius:999px;background:#6f4327;color:#fff6df;font-size:13px;letter-spacing:1px}
.world-progress{margin:7px 66px 0 0;padding:8px 15px;border:3px solid var(--ink);border-radius:999px;background:rgba(255,245,215,.82);box-shadow:0 4px 0 rgba(75,46,30,.3);font-size:13px;white-space:nowrap}
.world-map{position:relative;min-height:clamp(650px,73dvh,840px);margin:0 clamp(10px,3vw,34px) 24px}
.world-map::before{
  content:"";position:absolute;inset:8% 6% 5%;opacity:.47;background:
    radial-gradient(ellipse at 15% 24%,#89a36b 0 6%,transparent 6.5%),
    radial-gradient(ellipse at 84% 16%,#a9a18b 0 8%,transparent 8.5%),
    radial-gradient(ellipse at 78% 77%,#68a2b0 0 11%,transparent 11.5%),
    radial-gradient(ellipse at 35% 84%,#8d9e67 0 9%,transparent 9.5%);
}
.world-route{position:absolute;inset:8% 7% 7%;border:5px dashed rgba(117,75,46,.48);border-radius:48% 39% 47% 31%;transform:rotate(-5deg)}
.distant-region{position:absolute;width:clamp(80px,13vw,150px);height:clamp(52px,8vw,94px);opacity:.52;filter:grayscale(.45)}
.distant-region::before,.distant-region::after{content:"";position:absolute;bottom:0;border-radius:70% 50% 14% 18%;background:#a08d70}
.distant-region::before{left:7%;width:58%;height:76%;clip-path:polygon(50% 0,100% 100%,0 100%)}
.distant-region::after{right:2%;width:54%;height:58%;clip-path:polygon(55% 0,100% 100%,0 100%)}
.distant-region:nth-of-type(1){top:9%;left:9%}.distant-region:nth-of-type(2){top:8%;left:39%}.distant-region:nth-of-type(3){top:13%;right:7%}
.distant-region:nth-of-type(4){top:37%;left:4%}.distant-region:nth-of-type(5){top:42%;right:4%}.distant-region:nth-of-type(6){top:64%;left:3%}
.distant-region:nth-of-type(7){top:69%;left:29%}.distant-region:nth-of-type(8){top:63%;right:29%}.distant-region:nth-of-type(9){top:70%;right:3%}
.distant-region:nth-of-type(10){bottom:2%;left:18%}.distant-region:nth-of-type(11){bottom:1%;right:17%}
.distant-region span{position:absolute;inset:auto -12% -22px;color:#74634f;font-size:11px;text-align:center;letter-spacing:2px}
.launch-district{
  position:absolute;z-index:5;top:24%;left:50%;display:grid;justify-items:center;width:min(48vw,390px);min-width:260px;padding:0;
  border:0;background:transparent;transform:translateX(-50%);filter:drop-shadow(0 12px 5px rgba(70,42,26,.25));
}
.launch-district::before{content:"";position:absolute;top:3%;width:80%;aspect-ratio:1;border:4px solid rgba(244,196,79,.9);border-radius:50%;background:radial-gradient(circle,rgba(255,240,147,.48),transparent 67%);animation:world-beacon 2.8s ease-in-out infinite}
.launch-district picture{position:relative;width:78%;aspect-ratio:1}
.launch-district img{width:100%;height:100%;object-fit:contain}
.launch-plaque{position:relative;margin-top:-9%;padding:9px 25px 11px;border:4px solid var(--ink);border-radius:13px;background:#f5dfae;box-shadow:var(--shadow);transform:rotate(-1deg)}
.launch-plaque small{display:block;color:#9a4633;font-size:11px;letter-spacing:1.4px}
.launch-plaque strong{display:block;font-size:clamp(24px,5vw,38px);line-height:1}
.launch-plaque span{display:block;margin-top:4px;color:#735540;font-size:12px}
@keyframes world-beacon{0%,100%{opacity:.7;transform:scale(.94)}50%{opacity:1;transform:scale(1.03)}}

/* District route page: four lessons on one authored, fixed-ratio map. */
.district-view{position:relative;min-height:100dvh;padding:0 0 env(safe-area-inset-bottom);background:#1f140f}
.district-toolbar{position:relative;z-index:40;width:min(940px,100%);margin:auto;padding:9px clamp(10px,2.5vw,22px);border-bottom:4px solid #5c3c2b;background:#f3dfb3;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.district-toolbar__inner{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.back-world{display:inline-flex;align-items:center;justify-content:center;min-width:92px;min-height:48px;padding:8px 14px;border:3px solid var(--ink);border-radius:999px;background:#fff0c8;box-shadow:0 3px 0 var(--ink);font-size:13px;white-space:nowrap}
.district-brand{min-width:0;text-align:center}
.district-brand h2{margin:0;overflow:hidden;color:#8d3c29;font-size:clamp(20px,4.4vw,32px);line-height:1.02;text-overflow:ellipsis;white-space:nowrap}
.district-brand p{margin:3px 0 0;color:#6b4a36;font-size:clamp(9px,1.7vw,12px);letter-spacing:.5px}
.district-toolbar .settings-bookmark{position:relative;top:auto;right:auto;width:50px;height:48px;border-radius:12px;font-size:12px}
.district-toolbar .settings-bookmark::after{display:none}
.district-map{position:relative;overflow:hidden;width:min(940px,100%);height:auto;aspect-ratio:940/1672;margin:auto;background:#2e1d15;box-shadow:0 0 48px rgba(0,0,0,.55);touch-action:pan-y;isolation:isolate}
.district-map__paper{position:absolute;z-index:0;inset:0;width:100%;height:100%}
.district-map__paper img{width:100%;height:100%;object-fit:contain}
.district-locations{position:absolute;z-index:8;inset:0;margin:0;padding:0;list-style:none}
.map-location{position:absolute;display:grid;place-items:center;text-align:center}
.published-location{position:relative;display:flex;flex-direction:column;align-items:center;width:100%;color:inherit;text-decoration:none;transition:transform .2s ease}
.published-marker{position:relative;z-index:2;width:100%;aspect-ratio:1;filter:drop-shadow(0 7px 3px rgba(66,41,26,.25))}
.landmark-stack picture{position:absolute;inset:0}
.landmark-stack img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.location-plaque{position:relative;z-index:5;width:max-content;max-width:90%;margin-top:-3%;padding:7px clamp(12px,3vw,22px) 8px;border:3px solid #5e3b28;border-radius:11px 11px 16px 16px;background:#f3deb1;box-shadow:inset 0 0 0 2px var(--accent,#a54332),0 4px 0 rgba(73,49,38,.7);transform:rotate(var(--angle,-1deg))}
.map-location[data-location-id="lesson50"]{--accent:#7450a8;--angle:1deg}
.map-location[data-location-id="lesson50"] .location-plaque{margin-top:-13%}
.map-location[data-location-id="lesson51"]{--accent:#276d9d;--angle:.6deg}
.map-location[data-location-id="lesson52"]{--accent:#4c855f;--angle:-.4deg}
.map-location[data-location-id="lesson52"] .location-plaque{margin-top:-13%}
.location-kind{display:block;color:var(--accent);font-size:clamp(9px,1.5vw,12px);line-height:1;font-weight:800;letter-spacing:1.1px}
.location-title{display:block;margin-top:3px;font-size:clamp(13px,2.7vw,22px);line-height:1.05;white-space:nowrap}
.progress-stamps{display:flex;justify-content:center;gap:4px;margin-top:6px}
.progress-stamp{width:clamp(10px,1.7vw,14px);height:clamp(10px,1.7vw,14px);border:2px solid #856b4e;border-radius:50%;background:rgba(255,255,255,.52)}
.progress-stamp[data-earned="true"]{border-color:#8d4a25;background:var(--gold);box-shadow:inset 0 0 0 2px #fff0a9}
.map-location[data-map-change="true"] .published-marker{animation:map-new-change 1.2s ease-in-out 2}
.new-change-sticker{position:absolute;z-index:12;top:11%;right:2%;padding:5px 9px;border:3px solid #763f2c;border-radius:7px;background:#f8cc53;box-shadow:0 3px 0 #763f2c;transform:rotate(8deg);font-size:10px}
.route-mascot{position:absolute;z-index:22;left:39.8%;top:64.6%;width:12.5%;aspect-ratio:1;pointer-events:none;transition:left .45s ease,top .45s ease}
.route-mascot[data-route-avatar-target="lesson49"]{left:43%;top:27.6%}
.route-mascot[data-route-avatar-target="lesson50"]{left:45%;top:39.5%}
.route-mascot[data-route-avatar-target="lesson51"]{left:39.8%;top:64.6%}
.route-mascot[data-route-avatar-target="lesson52"]{left:42%;top:84.7%}
.route-mascot[data-route-avatar-target="route-exit"]{left:43%;top:91.2%}
.route-mascot__marker{position:absolute;z-index:0;left:9%;right:9%;bottom:-2%;height:auto;filter:drop-shadow(0 2px 2px rgba(83,49,22,.28))}
.route-mascot__marker img,.route-mascot__cat img{width:100%;height:100%;object-fit:contain}
.route-mascot__cat{position:absolute;z-index:1;inset:0;animation:cat-walk-rest 2.4s ease-in-out infinite;transform-origin:50% 88%}
.route-mascot[data-route-avatar-target="lesson50"] .route-mascot__cat,.route-mascot[data-route-avatar-target="lesson52"] .route-mascot__cat{transform:scaleX(-1)}
.map-loader{position:absolute;z-index:60;inset:0;display:grid;place-items:center;background:#cbb78e;opacity:0;visibility:hidden;transition:opacity .24s ease,visibility 0s linear .24s}
.map-loader[data-visible="true"]{opacity:1;visibility:visible;transition-delay:0s}
.map-loader[hidden]{display:none}
.map-loader__stage{position:relative;width:clamp(210px,52%,380px);aspect-ratio:1;filter:drop-shadow(0 6px 4px rgba(50,31,20,.35))}
.map-loader__frame{position:absolute;inset:0;opacity:0;animation:loader-frame-cycle 3.2s step-end infinite}
.map-loader__frame:nth-child(2){animation-delay:.8s}.map-loader__frame:nth-child(3){animation-delay:1.6s}.map-loader__frame:nth-child(4){animation-delay:2.4s}
.map-loader__frame img{width:100%;height:100%;object-fit:contain}
@keyframes cat-walk-rest{0%,100%{translate:0 0}50%{translate:0 -3%}}
@keyframes loader-frame-cycle{0%,24.99%{opacity:1}25%,100%{opacity:0}}
@keyframes map-new-change{0%,100%{filter:drop-shadow(0 7px 3px rgba(66,41,26,.25))}50%{filter:drop-shadow(0 0 18px #ffd954) drop-shadow(0 7px 3px rgba(66,41,26,.25))}}
.map-update-toast{position:fixed;z-index:65;left:50%;top:max(74px,calc(env(safe-area-inset-top) + 66px));transform:translateX(-50%) rotate(-1deg);width:max-content;max-width:calc(100vw - 30px);padding:9px 18px;border:3px solid var(--ink);border-radius:999px;background:#fff0c8;box-shadow:var(--shadow);font-size:13px;text-align:center}

/* Device settings */
.settings-dialog{width:min(92vw,520px);padding:0;border:4px solid var(--ink);border-radius:24px;background:#fff8e7;color:var(--ink);box-shadow:0 15px 0 rgba(49,30,21,.52)}
.settings-dialog::backdrop{background:rgba(24,14,10,.72);backdrop-filter:blur(4px)}
.settings-panel{padding:25px}.settings-panel h2{margin:0;font-size:28px}.settings-panel p{margin:8px 0 18px;color:var(--ink-soft)}
.settings-actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.settings-actions button{min-height:46px;padding:8px 16px;border:3px solid var(--ink);border-radius:999px;background:#fff;box-shadow:0 3px 0 var(--ink)}
.settings-actions .danger{background:#a54332;color:#fff4dc}

@media (hover:hover) and (pointer:fine){.published-location:hover,.launch-district:hover{transform:translateX(-50%) translateY(-3px)}.published-location:hover{transform:translateY(-3px)}}
@media (max-width:640px){
  .world-overview{padding:0}.world-book{min-height:100dvh;border-width:0;border-radius:0;box-shadow:none}
  .world-mast{display:block;padding:28px 22px 0}.world-progress{display:inline-block;margin:12px 0 0}.world-map{min-height:690px;margin-inline:5px}
  .launch-district{top:26%;width:76vw;min-width:245px}.distant-region{opacity:.42}
  .district-map{width:100%;border-radius:0}
  .district-toolbar{padding:8px 9px}.district-toolbar__inner{gap:7px}
  .back-world{min-width:82px;padding-inline:10px;font-size:12px}
  .district-brand h2{font-size:clamp(18px,5.5vw,24px)}.district-brand p{font-size:9px}
  .district-toolbar .settings-bookmark{width:46px;height:46px}
  .location-plaque{max-width:94%;padding-inline:10px}
}
@media (min-width:760px) and (orientation:landscape){
  .world-map{min-height:570px}.launch-district{top:18%;width:min(34vw,360px)}
  .world-brand h1{font-size:clamp(44px,6vw,67px)}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}.launch-district::before,.map-location[data-map-change="true"] .published-marker,.route-mascot__cat,.map-loader__frame{animation:none!important}
  .published-location,.settings-bookmark,.route-mascot,.map-loader{transition:none!important}
  .map-loader__frame{opacity:0}.map-loader__frame:nth-child(2){opacity:1}
}
</style>
</head>
<body data-atlas-view="world">
<main class="atlas-app" id="adventureAtlas">
  <section class="world-overview" id="worldOverview" aria-labelledby="worldTitle">
    <div class="world-book">
      <button class="settings-bookmark" type="button" data-open-settings aria-label="设备冒险设置">设置</button>
      <header class="world-mast">
        <div class="world-brand">
          <p class="world-kicker">CANRAN ENGLISH TOWN</p>
          <h1 id="worldTitle">十二城区冒险图鉴</h1>
          <p>我的英语探险地图册</p>
        </div>
        <p class="world-progress"><span id="worldCompletedCount">0</span> 个地点完成</p>
      </header>
      <div class="world-map" id="worldDistricts" aria-label="十二城区世界总览">
        <div class="world-route" aria-hidden="true"></div>
        <div class="distant-region" aria-hidden="true"><span>云雾山脉</span></div>
        <div class="distant-region" aria-hidden="true"><span>晨光原野</span></div>
        <div class="distant-region" aria-hidden="true"><span>回声溪谷</span></div>
        <div class="distant-region" aria-hidden="true"><span>单词花园</span></div>
        <div class="distant-region" aria-hidden="true"><span>故事港湾</span></div>
        <div class="distant-region" aria-hidden="true"><span>四季丘陵</span></div>
        <div class="distant-region" aria-hidden="true"><span>环球车站</span></div>
        <div class="distant-region" aria-hidden="true"><span>句型山城</span></div>
        <div class="distant-region" aria-hidden="true"><span>阅读森林</span></div>
        <div class="distant-region" aria-hidden="true"><span>表达海湾</span></div>
        <div class="distant-region" aria-hidden="true"><span>星原与广场</span></div>
        <button class="launch-district" type="button" id="enterLaunchDistrict" aria-label="进入四季生活城">
          <picture id="launchDistrictPreview" aria-hidden="true">
            <source type="image/avif" data-launch-preview-source="avif" sizes="(max-width:640px) 60vw, 305px">
            <source type="image/webp" data-launch-preview-source="webp" sizes="(max-width:640px) 60vw, 305px">
            <img data-launch-preview-image width="1024" height="1024" alt="" decoding="async" fetchpriority="high">
          </picture>
          <span class="launch-plaque">
            <small>第 5 城区 · Lesson 49–60</small>
            <strong>四季生活城</strong>
            <span>从风味四季路出发</span>
          </span>
        </button>
      </div>
    </div>
  </section>

  <section class="district-view" id="currentDistrict" aria-labelledby="currentDistrictTitle" hidden>
    <header class="district-toolbar">
      <div class="district-toolbar__inner">
        <button class="back-world" id="backToWorld" type="button" aria-label="返回世界总览">← 世界图鉴</button>
        <div class="district-brand">
          <h2 id="currentDistrictTitle" tabindex="-1">四季生活城</h2>
          <p>风味四季路 · Lesson 49–52</p>
        </div>
        <button class="settings-bookmark" type="button" data-open-settings aria-label="设备冒险设置">设置</button>
      </div>
    </header>
    <div class="district-map" id="districtMap">
      <picture class="district-map__paper" id="districtMapPaper" aria-hidden="true">
        <source type="image/avif" data-atlas-paper-source="avif" sizes="(max-width:940px) 100vw, 940px">
        <source type="image/webp" data-atlas-paper-source="webp" sizes="(max-width:940px) 100vw, 940px">
        <img data-atlas-paper-image width="940" height="1672" alt="" decoding="async" fetchpriority="high">
      </picture>
      <ol class="district-locations" id="districtLocations" aria-label="风味四季路学习地点"></ol>
      <div class="route-mascot" id="routeMascot" data-route-avatar-target="lesson49" aria-hidden="true">
        <picture class="route-mascot__marker">
          <source type="image/avif" data-route-marker-source="avif" sizes="(max-width:520px) 12vw, 112px">
          <source type="image/webp" data-route-marker-source="webp" sizes="(max-width:520px) 12vw, 112px">
          <img data-route-marker-image width="1448" height="1086" alt="" decoding="async">
        </picture>
        <picture class="route-mascot__cat">
          <source type="image/avif" data-route-cat-source="avif" sizes="(max-width:520px) 13vw, 118px">
          <source type="image/webp" data-route-cat-source="webp" sizes="(max-width:520px) 13vw, 118px">
          <img data-route-cat-image width="1254" height="1254" alt="" decoding="async">
        </picture>
      </div>
      <div class="map-loader" id="mapLoader" aria-hidden="true" hidden>
        <div class="map-loader__stage">
          <picture class="map-loader__frame" data-loader-frame="1">
            <source type="image/avif" data-route-loader-source="avif" sizes="(max-width:520px) 38vw, 300px">
            <source type="image/webp" data-route-loader-source="webp" sizes="(max-width:520px) 38vw, 300px">
            <img data-route-loader-image width="1254" height="1254" alt="" decoding="async">
          </picture>
          <picture class="map-loader__frame" data-loader-frame="2">
            <source type="image/avif" data-route-loader-source="avif" sizes="(max-width:520px) 38vw, 300px">
            <source type="image/webp" data-route-loader-source="webp" sizes="(max-width:520px) 38vw, 300px">
            <img data-route-loader-image width="1254" height="1254" alt="" decoding="async">
          </picture>
          <picture class="map-loader__frame" data-loader-frame="3">
            <source type="image/avif" data-route-loader-source="avif" sizes="(max-width:520px) 38vw, 300px">
            <source type="image/webp" data-route-loader-source="webp" sizes="(max-width:520px) 38vw, 300px">
            <img data-route-loader-image width="1254" height="1254" alt="" decoding="async">
          </picture>
          <picture class="map-loader__frame" data-loader-frame="4">
            <source type="image/avif" data-route-loader-source="avif" sizes="(max-width:520px) 38vw, 300px">
            <source type="image/webp" data-route-loader-source="webp" sizes="(max-width:520px) 38vw, 300px">
            <img data-route-loader-image width="1254" height="1254" alt="" decoding="async">
          </picture>
        </div>
      </div>
    </div>
    <p class="map-update-toast" id="mapUpdateToast" role="status" aria-live="polite" hidden></p>
  </section>
</main>

<dialog class="settings-dialog" id="deviceSettingsDialog" aria-labelledby="settingsTitle">
  <section class="settings-panel" id="settingsOverview">
    <h2 id="settingsTitle">设备冒险设置</h2>
    <p id="deviceStorageStatus">正在检查这台设备的进度…</p>
    <div class="settings-actions">
      <button type="button" data-close-settings>返回图鉴</button>
      <button type="button" class="danger" id="beginRestart">重开冒险</button>
    </div>
  </section>
  <section class="settings-panel" id="restartConfirm" hidden>
    <h2>要重新开始吗？</h2>
    <p>下一步会再确认一次。现在还不会清除任何星级、地图装饰或纪念物。</p>
    <div class="settings-actions">
      <button type="button" id="cancelRestartFirst">先不重开</button>
      <button type="button" class="danger" id="continueRestart">继续确认</button>
    </div>
  </section>
  <section class="settings-panel" id="restartFinalConfirm" hidden>
    <h2>最后确认</h2>
    <p>确认后会清除这台设备上的课程星级、地图装饰和纪念物，无法撤销。</p>
    <div class="settings-actions">
      <button type="button" id="cancelRestart">取消重开</button>
      <button type="button" class="danger" id="confirmRestart">确认重开</button>
    </div>
  </section>
</dialog>

<noscript><p style="margin:0;padding:24px;background:#fff3cf;color:#493126;text-align:center">请开启 JavaScript 查看十二城区冒险图鉴。</p></noscript>

<script src="/core/storage.js"></script>
<script src="/core/progress.js"></script>
<script src="/core/course-catalog.js"></script>
<script src="/core/adventure-atlas.js"></script>
<script src="/core/device-profile.js"></script>
<script>
function browserStorageOrNull(){try{return window.localStorage}catch{return null}}
const deviceStorage=browserStorageOrNull();
const courses=CanranCore.courseCatalog.COURSES;
const launchDistrict=CanranCore.courseCatalog.LAUNCH_DISTRICT;
const routePage=CanranCore.adventureAtlas.GOLDEN_ROUTE_PAGE;
let profileState=CanranCore.deviceProfile.initializeDeviceProfile({storage:deviceStorage,courses});
const worldOverview=document.getElementById('worldOverview');
const currentDistrict=document.getElementById('currentDistrict');
const districtLocations=document.getElementById('districtLocations');
let districtRendered=false;
let launchPreviewLoaded=false;
let districtPaperLoaded=false;
let routeMascotLoaded=false;
let districtAssetsReady=false;

function routeAssetUrl(path,asset){return `/${path}?v=${encodeURIComponent(asset.version)}`}

function loadLaunchPreview(){
  if(launchPreviewLoaded)return;
  const course=CanranCore.courseCatalog.requirePublishedCourse('lesson49');
  const asset=course.map.stateAssets.at(-1);
  const picture=document.getElementById('launchDistrictPreview');
  if(!asset||!picture)return;
  const stateUrl=(path)=>CanranCore.courseCatalog.mapStateAssetUrl(path,asset);
  picture.querySelectorAll('[data-launch-preview-source]').forEach(source=>{
    const type=source.dataset.launchPreviewSource;
    source.srcset=asset.variants.map(variant=>`${stateUrl(variant[type])} ${variant.width}w`).join(', ');
  });
  const image=picture.querySelector('[data-launch-preview-image]');
  image.src=stateUrl(asset.png);
  launchPreviewLoaded=true;
}

function loadDistrictPaper(){
  if(districtPaperLoaded)return;
  const asset=routePage.backgroundAsset;
  const picture=document.getElementById('districtMapPaper');
  picture.querySelectorAll('[data-atlas-paper-source]').forEach(source=>{
    const type=source.dataset.atlasPaperSource;
    source.srcset=asset.variants.map(variant=>`${routeAssetUrl(variant[type],asset)} ${variant.width}w`).join(', ');
  });
  picture.querySelector('[data-atlas-paper-image]').src=routeAssetUrl(asset.png,asset);
  districtPaperLoaded=true;
}

function loadRouteMascot(){
  if(routeMascotLoaded)return;
  const cat=routePage.mascotAsset;
  const marker=routePage.markerAsset;
  document.querySelectorAll('[data-route-cat-source]').forEach(source=>{
    const type=source.dataset.routeCatSource;
    source.srcset=cat.variants.map(variant=>`${routeAssetUrl(variant[type],cat)} ${variant.width}w`).join(', ');
  });
  document.querySelectorAll('[data-route-cat-image]').forEach(image=>{
    image.src=routeAssetUrl(cat.png,cat);
  });
  document.querySelectorAll('[data-route-marker-source]').forEach(source=>{
    const type=source.dataset.routeMarkerSource;
    source.srcset=marker.variants.map(variant=>`${routeAssetUrl(variant[type],marker)} ${variant.width}w`).join(', ');
  });
  document.querySelectorAll('[data-route-marker-image]').forEach(image=>{
    image.src=routeAssetUrl(marker.png,marker);
  });
  routePage.loaderFrames.forEach(frame=>{
    const picture=document.querySelector(`[data-loader-frame="${frame.frame}"]`);
    if(!picture)return;
    picture.querySelectorAll('[data-route-loader-source]').forEach(source=>{
      const type=source.dataset.routeLoaderSource;
      source.srcset=frame.variants.map(variant=>`${routeAssetUrl(variant[type],frame)} ${variant.width}w`).join(', ');
    });
    picture.querySelector('[data-route-loader-image]').src=routeAssetUrl(frame.png,frame);
  });
  routeMascotLoaded=true;
}

function waitForImage(image){
  if(!image)return Promise.resolve();
  if(image.complete&&image.naturalWidth>0)return typeof image.decode==='function'?image.decode().catch(()=>{}):Promise.resolve();
  return new Promise(resolve=>{
    const done=()=>resolve();
    image.addEventListener('load',done,{once:true});
    image.addEventListener('error',done,{once:true});
    window.setTimeout(done,4500);
  });
}

async function revealDistrictWhenReady(){
  const loader=document.getElementById('mapLoader');
  if(districtAssetsReady){loader.hidden=true;return}
  loader.hidden=false;
  const revealTimer=window.setTimeout(()=>{loader.dataset.visible='true'},180);
  const activeImage=districtLocations.querySelector('[data-map-guidance="active"] [data-landmark-snapshot]');
  await Promise.all([
    waitForImage(document.querySelector('[data-atlas-paper-image]')),
    waitForImage(document.querySelector('#routeMascot [data-route-cat-image]')),
    waitForImage(document.querySelector('[data-route-marker-image]')),
    waitForImage(document.querySelector('[data-route-loader-image]')),
    waitForImage(activeImage)
  ]);
  window.clearTimeout(revealTimer);
  districtAssetsReady=true;
  if(loader.dataset.visible==='true'){
    delete loader.dataset.visible;
    window.setTimeout(()=>{loader.hidden=true},260);
  }else loader.hidden=true;
}

function landmarkMarkup(location,{priority=false}={}){
  const asset=location.landmarkAsset;
  if(!asset)return '';
  const stateUrl=(path)=>CanranCore.courseCatalog.mapStateAssetUrl(path,asset);
  const source=(type)=>asset.variants.map(variant=>`${stateUrl(variant[type])} ${variant.width}w`).join(', ');
  return `<picture data-landmark-state="${asset.stageCount}">
    <source type="image/avif" srcset="${source('avif')}" sizes="(max-width:520px) 50vw, 470px">
    <source type="image/webp" srcset="${source('webp')}" sizes="(max-width:520px) 50vw, 470px">
    <img src="${stateUrl(asset.png)}" alt="" width="1024" height="1024" data-landmark-snapshot="${asset.stageCount}" loading="${priority?'eager':'lazy'}" decoding="async"${priority?' fetchpriority="high"':''}>
  </picture>`;
}

function progressMarkup(location){
  const stamps=location.progressStamps.map(stamp=>`<span class="progress-stamp" data-stage-id="${stamp.id}" data-earned="${stamp.earned}" aria-hidden="true"></span>`).join('');
  return `<span class="progress-stamps">${stamps}</span><span class="sr-only">学习进度 ${location.completedStageCount}/${location.totalStageCount}</span>`;
}

function routePlacementStyle(locationId){
  const placement=CanranCore.adventureAtlas.GOLDEN_ROUTE_PAGE.placements[locationId];
  if(!placement)return '';
  return ['top','right','bottom','left','width']
    .filter(property=>Number.isFinite(placement[property]))
    .map(property=>`${property}:${placement[property]}%`)
    .join(';');
}

function locationMarkup(location,recommended,focusedId){
  if(location.status!=='published') return '';
  const active=focusedId?location.id===focusedId:location.id===recommended?.id;
  const pending=location.id===focusedId&&location.pendingChangeCount>0;
  const kind=location.kind==='special'?'专项支线':`LESSON ${location.lesson}`;
  const changeCopy=pending?'<span class="new-change-sticker">新变化</span>':'';
  const completionCopy=location.progressState==='complete'?'地点完成，':'';
  const accessible=`${active?'当前冒险位置，':''}${completionCopy}${kind}，${location.title}，学习进度 ${location.completedStageCount}/${location.totalStageCount}`;
  return `<li class="map-location" style="${routePlacementStyle(location.id)}" data-location-id="${location.id}" data-map-lesson="${location.lesson??''}" data-location-status="published"${active?' data-map-guidance="active"':''}${pending?' data-map-change="true"':''}>
    <a class="published-location" href="${location.route}" data-course-id="${location.id}" aria-label="${accessible}"${active?' aria-current="step"':''}>
      <span class="published-marker landmark-stack" aria-hidden="true">${landmarkMarkup(location,{priority:active||pending})}</span>
      ${changeCopy}
      <span class="location-plaque"><span class="location-kind">${kind}</span><strong class="location-title">${location.title}</strong>${progressMarkup(location)}</span>
    </a>
  </li>`;
}

function getPublishedLocations(){
  return CanranCore.adventureAtlas.buildLocationModels(CanranCore.courseCatalog.MAP_COURSES,profileState.profile).filter(location=>location.status==='published');
}

function getRoutePageLocations(){
  return CanranCore.adventureAtlas.buildRoutePageLocationModels(CanranCore.courseCatalog.MAP_COURSES,profileState.profile).filter(location=>location.status==='published');
}

function renderWorldProgress(){
  document.getElementById('worldCompletedCount').textContent=String(getPublishedLocations().filter(location=>location.kind==='lesson'&&location.progressState==='complete').length);
}

function renderDistrict(focusedId=null){
  const locations=getRoutePageLocations();
  const recommended=CanranCore.adventureAtlas.selectRecommendedLocation(locations,profileState.profile);
  districtLocations.innerHTML=locations.map(location=>locationMarkup(location,recommended,focusedId)).join('');
  document.getElementById('routeMascot').dataset.routeAvatarTarget=CanranCore.adventureAtlas.selectRouteAvatarTarget(locations,focusedId,profileState.profile)||'route-exit';
  districtLocations.querySelectorAll('[data-course-id]').forEach(link=>link.addEventListener('click',()=>{
    const result=CanranCore.deviceProfile.recordLocationVisit({storage:deviceStorage,courses,courseId:link.dataset.courseId});
    if(result.persisted) profileState={profile:result.profile,persisted:true};
  }));
  districtRendered=true;
  return locations;
}

function showWorld({focusEntrance=false}={}){
  loadLaunchPreview();
  currentDistrict.hidden=true;worldOverview.hidden=false;document.body.dataset.atlasView='world';
  renderWorldProgress();
  if(focusEntrance) document.getElementById('enterLaunchDistrict').focus();
}

function showDistrict({focusedId=null,focusHeading=false}={}){
  loadDistrictPaper();
  loadRouteMascot();
  const locations=renderDistrict(focusedId);
  worldOverview.hidden=true;currentDistrict.hidden=false;document.body.dataset.atlasView='district';
  revealDistrictWhenReady();
  if(focusHeading) document.getElementById('currentDistrictTitle').focus();
  if(focusedId){
    const location=locations.find(item=>item.id===focusedId);
    const element=districtLocations.querySelector(`[data-location-id="${focusedId}"]`);
    requestAnimationFrame(()=>element?.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));
    const summary=CanranCore.adventureAtlas.buildMapChangeSummary(location);
    if(summary&&element){
      const toast=document.getElementById('mapUpdateToast');
      toast.textContent=`${location.title}：${summary.copy}`;toast.hidden=false;
      window.setTimeout(()=>{
        const consumed=CanranCore.deviceProfile.consumeMapChanges({storage:deviceStorage,courses,courseId:focusedId});
        if(consumed.persisted) profileState={profile:consumed.profile,persisted:true};
        toast.hidden=true;element.removeAttribute('data-map-change');element.querySelector('.new-change-sticker')?.remove();
      },2200);
    }
  }
}

document.getElementById('enterLaunchDistrict').addEventListener('click',()=>{
  const result=CanranCore.deviceProfile.visitDistrict({storage:deviceStorage,courses,profile:profileState.profile,districtId:launchDistrict.id});
  if(result.persisted) profileState={profile:result.profile,persisted:true};
  showDistrict({focusHeading:true});
});
document.getElementById('backToWorld').addEventListener('click',()=>showWorld({focusEntrance:true}));

function initializeView(){
  const params=new URLSearchParams(location.search);
  const districtId=params.get('district');
  const focusId=params.get('focus');
  const validFocus=getRoutePageLocations().some(location=>location.id===focusId);
  if(districtId===launchDistrict.id&&validFocus) showDistrict({focusedId:focusId});
  else showWorld();
}

const dialog=document.getElementById('deviceSettingsDialog');
const overview=document.getElementById('settingsOverview');
const confirmPanel=document.getElementById('restartConfirm');
const finalConfirmPanel=document.getElementById('restartFinalConfirm');
document.getElementById('deviceStorageStatus').textContent=profileState.persisted?'进度会保存在这台设备上。':'当前浏览器无法永久保存进度。';
document.querySelectorAll('[data-open-settings]').forEach(button=>button.addEventListener('click',()=>dialog.showModal()));
document.querySelectorAll('[data-close-settings]').forEach(button=>button.addEventListener('click',()=>dialog.close()));
document.getElementById('beginRestart').addEventListener('click',()=>{overview.hidden=true;confirmPanel.hidden=false;finalConfirmPanel.hidden=true;document.getElementById('cancelRestartFirst').focus()});
document.getElementById('cancelRestartFirst').addEventListener('click',()=>{overview.hidden=false;confirmPanel.hidden=true;finalConfirmPanel.hidden=true;document.getElementById('beginRestart').focus()});
document.getElementById('continueRestart').addEventListener('click',()=>{confirmPanel.hidden=true;finalConfirmPanel.hidden=false;document.getElementById('cancelRestart').focus()});
document.getElementById('cancelRestart').addEventListener('click',()=>{overview.hidden=false;confirmPanel.hidden=true;finalConfirmPanel.hidden=true;document.getElementById('beginRestart').focus()});
document.getElementById('confirmRestart').addEventListener('click',()=>{CanranCore.deviceProfile.restartAdventure({storage:deviceStorage,courses});location.assign('/')});
dialog.addEventListener('close',()=>{overview.hidden=false;confirmPanel.hidden=true;finalConfirmPanel.hidden=true});
initializeView();
</script>
</body>
</html>
