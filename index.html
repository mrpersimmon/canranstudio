<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFF8EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英语闯关乐园">
<link rel="icon" type="image/png" href="/assets/home/park-tent.png">
<title>英语闯关乐园 · 新概念英语互动课件</title>
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
:root{
  --cream:#FFF8EC;
  --paper:#FFFEFA;
  --paper-warm:#FFF4E5;
  --brown:#38281F;
  --brown-soft:#765E4A;
  --red:#EF5141;
  --red-soft:#FDE2DC;
  --yellow:#F6B83E;
  --orange:#FF7A19;
  --orange-soft:#FFF0DB;
  --green:#69B66D;
  --purple:#8A67B8;
  --blue:#278BC4;
  --grey:#A39E96;
  --shadow:6px 7px 0 rgba(56,40,31,.16);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;
  color:var(--brown);
  background-color:var(--cream);
  background-image:radial-gradient(rgba(118,94,74,.13) 1.3px,transparent 1.3px);
  background-size:27px 27px;
  font:500 17px/1.55 'Baloo 2','ZCOOL KuaiLe','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input{font:inherit;color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
img{display:block;max-width:100%}
a{color:inherit}
.wrap{width:min(1080px,calc(100% - 36px));margin-inline:auto}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.no-script-nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:0 auto 36px;padding:18px;width:min(1080px,calc(100% - 36px));border:3px solid var(--brown);border-radius:18px;background:var(--paper)}
.no-script-nav a{padding:8px 14px;border:2px solid var(--brown);border-radius:999px;background:#fff;font-weight:800}

:focus-visible{outline:5px solid #176DA0;outline-offset:5px}

/* Header */
#hero{text-align:center;padding:44px 0 32px}
.kicker{
  display:inline-flex;align-items:center;min-height:36px;padding:6px 22px;margin-bottom:14px;
  border-radius:999px;background:var(--brown);color:#fff;font-weight:800;letter-spacing:2px;font-size:15px;
}
.hero-title{display:flex;align-items:center;justify-content:center;gap:12px}
.hero-title img{width:70px;height:70px;object-fit:contain;filter:drop-shadow(3px 4px 0 rgba(56,40,31,.14))}
#hero h1{
  margin:0;color:var(--red);font-size:clamp(38px,6.2vw,64px);line-height:1.05;font-weight:800;
  letter-spacing:2px;text-shadow:2px 2px 0 #fff,4px 4px 0 var(--brown);
}
#hero .en{margin-top:9px;font-size:clamp(17px,2.6vw,24px);font-weight:800;color:var(--brown-soft);letter-spacing:.4px}
#hero p{max-width:720px;margin:14px auto 0;font-weight:700;font-size:17px}

main{display:grid;gap:38px;padding-bottom:30px}

/* Continue */
.continue-card{
  display:grid;grid-template-columns:245px 1fr;min-height:294px;overflow:hidden;
  background:var(--paper);border:4px solid var(--brown);border-radius:25px;text-decoration:none;
  box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease;
}
.continue-art{
  display:flex;align-items:center;justify-content:center;padding:26px;
  background:linear-gradient(150deg,#FFF1ED 0%,#FAD4CC 100%);border-right:3px solid var(--brown);
}
.continue-art img{width:190px;height:190px;object-fit:contain;filter:drop-shadow(5px 7px 0 rgba(56,40,31,.11))}
.continue-copy{padding:26px 30px 24px}
.ribbon{
  display:inline-block;position:relative;margin-bottom:8px;padding:6px 18px 6px 14px;
  border-radius:4px 0 0 4px;background:var(--red);color:#fff;font-size:15px;font-weight:800;letter-spacing:.3px;
}
.ribbon::after{content:"";position:absolute;right:-12px;top:0;border-top:17px solid var(--red);border-bottom:17px solid var(--red);border-right:12px solid transparent}
.eyebrow{margin:0 0 2px;font-size:16px;font-weight:800;color:var(--brown-soft)}
.continue-copy h2{margin:0;font-size:clamp(27px,4vw,38px);line-height:1.15}
.subtitle{margin:2px 0 8px;font-weight:800;color:var(--brown-soft)}
.summary{margin:0 0 12px;font-size:15px;font-weight:700}
.feature-list{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;padding:0;list-style:none}
.feature-list li{padding:3px 11px;border:2px solid var(--brown);border-radius:999px;background:#fff;font-size:13px;font-weight:800}
.progress-row{display:grid;grid-template-columns:minmax(160px,1fr) auto auto;gap:12px;align-items:center}
.progress-track{height:18px;overflow:hidden;border:3px solid var(--brown);border-radius:999px;background:#fff}
.progress-fill{display:block;height:100%;width:0;background:var(--yellow);border-radius:999px;transition:width .65s cubic-bezier(.2,.8,.2,1)}
.progress-label{font-weight:800;white-space:nowrap}
.primary-action{
  display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:9px 19px;
  border:3px solid var(--brown);border-radius:999px;background:var(--red);color:#fff;font-size:16px;font-weight:800;
  box-shadow:0 4px 0 var(--brown);white-space:nowrap;
}
@media (hover:hover) and (pointer:fine){
  .continue-card:hover{transform:translateY(-4px);box-shadow:7px 11px 0 rgba(56,40,31,.14)}
}

/* Route */
.section-heading{display:flex;align-items:center;justify-content:center;gap:15px;margin:0 0 22px;text-align:center;font-size:clamp(27px,4vw,38px);line-height:1.2}
.section-heading::before,.section-heading::after{content:"";width:60px;height:3px;background:var(--brown-soft);border-radius:999px}
.heading-mark{color:var(--yellow);font-size:.75em}
.range-shell{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;gap:10px}
.range-arrow{
  width:46px;height:46px;border:3px solid var(--brown);border-radius:50%;background:var(--paper);
  box-shadow:0 3px 0 var(--brown);font-size:24px;font-weight:800;line-height:1;
}
.range-arrow:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
#rangeTickets{display:grid;grid-template-columns:repeat(6,minmax(105px,1fr));gap:10px;min-width:0}
.range-ticket{
  min-height:64px;padding:10px 7px;border:3px solid var(--brown);border-radius:7px;background:var(--paper);
  box-shadow:0 4px 0 rgba(56,40,31,.16);font-size:17px;font-weight:800;white-space:nowrap;
}
.range-ticket[aria-pressed="true"]{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--brown);transform:translateY(-2px)}
.route-toolbar{
  display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:18px;padding:12px 16px;
  border:2px solid #E7CEAD;border-radius:18px;background:rgba(255,254,250,.86);
}
#lessonSearchForm{display:flex;align-items:center;gap:8px;min-width:0}
#lessonSearchForm label{font-size:14px;font-weight:800;white-space:nowrap}
#lessonSearch{
  width:170px;min-height:39px;padding:6px 12px;border:2px solid var(--brown);border-radius:999px;background:#fff;
}
#lessonSearchForm button{min-height:39px;padding:5px 14px;border:2px solid var(--brown);border-radius:999px;background:var(--yellow);font-weight:800}
.legend{display:flex;align-items:center;justify-content:flex-end;gap:13px;font-size:13px;font-weight:800;white-space:nowrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:15px;height:15px;border:2px solid var(--brown);border-radius:50%;background:var(--grey)}
.legend .done i{background:var(--green)}
.legend .doing i{background:var(--orange)}
#lessonSearchStatus{min-height:28px;margin:8px 4px 0;text-align:center;font-size:14px;font-weight:800;color:#8E462F}
#lessonStations{
  position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:38px 18px;
  padding:24px 28px;margin-top:2px;
}
#lessonStations::before{
  content:"";position:absolute;inset:78px 4px 70px;border:4px dashed #836B4E;border-radius:80px;opacity:.85;pointer-events:none;
}
.station{
  position:relative;z-index:1;display:flex;flex-direction:column;min-height:240px;overflow:hidden;
  border:3px solid var(--brown);border-radius:18px;background:var(--paper);text-align:center;text-decoration:none;
  box-shadow:5px 6px 0 rgba(56,40,31,.18);transition:transform .16s ease;
}
.station-band{display:block;padding:7px 8px;background:var(--grey);color:#fff;font-size:16px;font-weight:800}
.station[data-tone="red"] .station-band{background:var(--red)}
.station[data-tone="purple"] .station-band{background:var(--purple)}
.station[data-tone="blue"] .station-band{background:var(--blue)}
.station[data-tone="green"] .station-band{background:var(--green)}
.station-art{display:flex;align-items:center;justify-content:center;height:96px;padding:10px 16px 3px}
.station-art img{width:88px;height:82px;object-fit:contain;filter:drop-shadow(3px 4px 0 rgba(56,40,31,.10))}
.station h3{margin:4px 8px 0;font-size:17px;line-height:1.2}
.station-subtitle{margin:2px 10px 6px;color:var(--brown-soft);font-size:12px;font-weight:800}
.station-progress{margin:auto 10px 8px;font-size:16px;font-weight:800}
.station-action{display:block;margin:0 10px 12px;padding:7px 10px;border:2px solid var(--brown);border-radius:999px;background:var(--grey);color:#fff;font-size:14px;font-weight:800;box-shadow:0 3px 0 var(--brown)}
.station[data-tone="red"] .station-action{background:var(--red)}
.station[data-tone="purple"] .station-action{background:var(--purple)}
.station[data-tone="blue"] .station-action{background:var(--blue)}
.station[data-tone="green"] .station-action{background:var(--green)}
.station.soon{min-height:205px;align-self:center;color:#777;background:rgba(255,254,250,.94)}
.station.soon .station-band{background:#8E8B86}
.station.soon:nth-child(6){grid-column:1;transform:translateX(50%)}
.station.soon:nth-child(7){grid-column:3}
.station.soon:nth-child(8){grid-column:4}
.soon-message{display:grid;place-items:center;flex:1;padding:22px 10px}
.soon-number{display:block;font-size:34px;font-weight:800;color:#A09A91}
.soon-message strong{display:block;margin-top:8px;font-size:18px}
@media (hover:hover) and (pointer:fine){.station[href]:hover{transform:translateY(-4px)}}
#routeEmpty{margin:34px auto 6px;padding:20px 24px;width:min(540px,100%);border:3px dashed var(--brown-soft);border-radius:18px;background:rgba(255,254,250,.8);text-align:center;font-weight:800}

/* Special station */
#specialStation{padding:20px;border:3px solid #B65317;border-radius:24px;background:rgba(255,254,250,.72)}
#specialTitle{color:var(--orange);margin-bottom:18px}
#specialTitle .tent-mark{width:48px;height:48px;object-fit:contain}
.special-card{
  display:grid;grid-template-columns:235px 1fr;overflow:hidden;border:4px solid var(--brown);border-radius:21px;
  background:var(--paper);text-decoration:none;box-shadow:var(--shadow);transition:transform .18s ease;
}
.special-art{display:flex;align-items:center;justify-content:center;padding:24px;background:var(--orange-soft);border-right:3px solid var(--brown)}
.special-art img{width:190px;height:150px;object-fit:contain;filter:drop-shadow(4px 5px 0 rgba(56,40,31,.12))}
.special-copy{padding:23px 28px 22px}
.special-copy h3{margin:0;font-size:30px;line-height:1.2}
.special-copy .feature-list{margin-top:12px}
.special-copy .primary-action{background:var(--orange)}
@media (hover:hover) and (pointer:fine){.special-card:hover{transform:translateY(-4px)}}

footer{text-align:center;padding:6px 18px 38px;font-size:14px;font-weight:700;color:var(--brown-soft)}
footer .tip{display:inline-block;margin-bottom:12px;padding:9px 17px;border:2px solid var(--brown);border-radius:12px;background:var(--paper);box-shadow:3px 3px 0 rgba(56,40,31,.12)}

@media (min-width:761px) and (max-width:940px){
  #lessonStations{grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 24px;padding-inline:30px}
  .station.soon:nth-child(6),.station.soon:nth-child(7),.station.soon:nth-child(8){grid-column:auto;transform:none}
}

@media (max-width:760px){
  body{font-size:16px}
  .wrap{width:min(100% - 28px,1080px)}
  #hero{padding:28px 0 24px}
  .hero-title{gap:7px}
  .hero-title img{width:48px;height:48px}
  #hero h1{font-size:clamp(31px,10vw,44px);letter-spacing:0;text-shadow:2px 2px 0 #fff,3px 3px 0 var(--brown)}
  #hero p{font-size:15px}
  main{gap:32px}
  .continue-card,.special-card{grid-template-columns:1fr}
  .continue-art{min-height:190px;border-right:0;border-bottom:3px solid var(--brown);padding:18px}
  .continue-art img{width:160px;height:160px}
  .continue-copy,.special-copy{padding:21px 18px 22px}
  .progress-row{grid-template-columns:1fr auto}
  .progress-row .primary-action{grid-column:1/-1;width:100%}
  .section-heading{gap:8px;font-size:27px}
  .section-heading::before,.section-heading::after{width:24px}
  .range-shell{grid-template-columns:42px minmax(0,1fr) 42px;gap:6px}
  .range-arrow{width:40px;height:40px;font-size:20px}
  #rangeTickets{display:flex;overflow-x:auto;overscroll-behavior-inline:contain;scroll-snap-type:x proximity;padding:4px 2px 10px;scrollbar-width:thin}
  .range-ticket{flex:0 0 104px;min-height:57px;scroll-snap-align:start}
  .route-toolbar{align-items:stretch;flex-direction:column;padding:13px}
  #lessonSearchForm{display:grid;grid-template-columns:auto minmax(0,1fr) auto}
  #lessonSearch{width:100%;min-width:0}
  .legend{justify-content:center;flex-wrap:wrap}
  #lessonStations{grid-template-columns:1fr;gap:20px;padding:14px 18px}
  #lessonStations::before{display:none}
  .station{min-height:282px}
  .station.soon{min-height:210px}
  .station.soon:nth-child(6),.station.soon:nth-child(7),.station.soon:nth-child(8){grid-column:auto;transform:none}
  #specialStation{padding:14px}
  #specialTitle{gap:5px;font-size:23px;white-space:nowrap}
  #specialTitle::before,#specialTitle::after{width:16px}
  #specialTitle .tent-mark{width:36px;height:36px}
  .special-art{border-right:0;border-bottom:3px solid var(--brown);padding:17px}
  .special-art img{height:132px}
}
@media (max-width:420px){
  .wrap{width:calc(100% - 22px)}
  .kicker{font-size:13px;letter-spacing:1px}
  #hero .en{font-size:16px}
  .continue-copy h2{font-size:29px}
  #lessonSearchForm label{grid-column:1/-1}
  #lessonSearchForm{grid-template-columns:minmax(0,1fr) auto}
  .special-copy h3{font-size:27px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header id="hero">
  <div class="wrap">
    <div class="kicker">新概念英语 · 互动课件</div>
    <div class="hero-title">
      <img src="/assets/home/park-tent.png" alt="" width="70" height="70">
      <h1>英语闯关乐园</h1>
    </div>
    <div class="en">NCE Interactive Adventure Park</div>
    <p>欢迎回来，小勇士！每一课都是一场大冒险：闯关、摘星、发证书。选一个乐园，坐稳你的英语之旅吧！</p>
  </div>
</header>

<main class="wrap">
  <section id="continuePanel" aria-labelledby="continueTitle"></section>

  <section id="lessonRoute" aria-labelledby="routeTitle">
    <h2 class="section-heading" id="routeTitle"><span class="heading-mark" aria-hidden="true">◆</span>第一册 · 学习路线<span class="heading-mark" aria-hidden="true">◆</span></h2>
    <div class="range-shell">
      <button class="range-arrow" id="previousRange" type="button" aria-label="上一分段">‹</button>
      <nav id="rangeTickets" aria-label="Lesson 分段"></nav>
      <button class="range-arrow" id="nextRange" type="button" aria-label="下一分段">›</button>
    </div>
    <div class="route-toolbar">
      <form id="lessonSearchForm" role="search">
        <label for="lessonSearch">按编号查找</label>
        <input id="lessonSearch" name="lesson" inputmode="numeric" autocomplete="off" placeholder="输入课号（如 49）" aria-describedby="lessonSearchStatus">
        <button type="submit">跳转</button>
      </form>
      <div class="legend" aria-label="课程状态说明">
        <span class="done"><i aria-hidden="true"></i>已完成</span>
        <span class="doing"><i aria-hidden="true"></i>进行中</span>
        <span><i aria-hidden="true"></i>即将开放</span>
      </div>
    </div>
    <p id="lessonSearchStatus" aria-live="polite"></p>
    <div id="lessonStations"></div>
    <p id="routeEmpty" hidden>这个分段还没有开放课程。</p>
  </section>

  <section id="specialStation" aria-labelledby="specialTitle">
    <h2 class="section-heading" id="specialTitle"><img class="tent-mark" src="/assets/home/park-tent.png" alt="" width="48" height="48">番外站 · 专项技能<span class="heading-mark" aria-hidden="true">◆</span></h2>
    <div id="specialCourses"></div>
  </section>
</main>

<noscript>
  <nav class="no-script-nav" aria-label="课程入口">
    <a href="/lesson49/">Lesson 49 · 肉店大冒险</a>
    <a href="/lesson50/">Lesson 50 · 挑食小王子大冒险</a>
    <a href="/lesson51/">Lesson 51 · 希腊四季之旅</a>
    <a href="/lesson52/">Lesson 52 · 环球护照之旅 Ⅰ</a>

    <a href="/soundmark/">番外篇 · 音标魔法乐园</a>
  </nav>
</noscript>

<footer>
  <div class="wrap">
    <div class="tip">小提示：星星进度保存在这台设备上，换设备会重新开始哦～</div>
    <div>英语闯关乐园 ｜ 新概念英语第一册互动课件 ｜ Lesson 49、50、51、52、53、54 · 音标第一课</div>
  </div>
</footer>

<script>
const COURSE_LEVELS = ['l1','l2','l3','l4','l5'];
const SOUND_LEVELS = ['vs','g1','g2','g3'];
const HOME_COURSES = [

    art:'/assets/home/lesson50-crown.png', tone:'purple',

  {
    kind:'lesson', lesson:51, route:'/lesson51/', title:'希腊四季之旅', subtitle:'A Pleasant Climate',

  {
    kind:'lesson', lesson:52, route:'/lesson52/', title:'环球护照之旅 Ⅰ', subtitle:'What Nationality Are They?',

  },
  {
    kind:'lesson', lesson:53, route:'/lesson53/', title:'英伦气候小主播', subtitle:'An Interesting Climate',
    description:'跟着汉斯和吉姆聊英国天气：东南西北四种天、春夏秋冬昼夜长短，15 句对白学会用英语聊气候！',
    features:['气候单词','对白剧场','罗盘配对','缺词魔法','主播证书'],
    art:'/assets/home/lesson53-climate.svg', tone:'green',
    progress:{key:'canran:l53:progress:v2',ids:COURSE_LEVELS,max:15}
  },
  {
    kind:'lesson', lesson:54, route:'/lesson54/', title:'环球护照之旅 Ⅱ', subtitle:'What Nationality Are They?',
    description:'第二卷·亚非大洋洲篇：再走 12 个国家，练习国籍句型，还有 does 疑问否定小魔法。',
    features:['国家国籍','机场广播','盖章配对','does 魔法','海关考核'],
    art:'/assets/home/lesson54-passport.svg', tone:'green',
    progress:{key:'canran:l54:progress:v2',ids:COURSE_LEVELS,max:15}
  },
  ...[55,56].map(lesson => ({kind:'lesson',lesson,route:null,title:'即将开放',subtitle:'',tone:'soon'})),
  {
    kind:'special', lesson:null, route:'/soundmark/', title:'音标魔法乐园', subtitle:'Phonics Magic · 音标第一课',
    description:'音标是单词的“拼音”！跟着元音精灵学发音、玩音节魔法、上对比擂台，看到生词也能自己试着读。',
    features:['元音精灵','音节魔法','对比擂台','游戏乐园','结业证书'],
    art:'/assets/home/soundmark-phonics.png', tone:'orange',
    progress:{key:'canran:soundmark:progress:v2',legacyKey:'phonics-magic-stars-v1',ids:SOUND_LEVELS,legacyMode:'reset',max:12}
  }
];

function loadCourseProgress(course){
  if(!course.progress) return {...course,stars:0,max:0};
  const result=CanranCore.storage.loadProgress({
    storage:localStorage,
    key:course.progress.key,
    legacyKey:course.progress.legacyKey,
    ids:course.progress.ids,
    legacyMode:course.progress.legacyMode
  });
  const stars=CanranCore.progress.totalRatings(result.progress.ratings,course.progress.ids);
  return {...course,stars,max:course.progress.max};
}

const hydratedCourses=HOME_COURSES.map(loadCourseProgress);
const continuePanel=document.getElementById('continuePanel');
const lessonStations=document.getElementById('lessonStations');
const routeEmpty=document.getElementById('routeEmpty');
const rangeTickets=document.getElementById('rangeTickets');
const previousRange=document.getElementById('previousRange');
const nextRange=document.getElementById('nextRange');
const lessonSearch=document.getElementById('lessonSearch');
const lessonSearchStatus=document.getElementById('lessonSearchStatus');
const recommendation=CanranCore.homeCatalog.pickContinueCourse(hydratedCourses);
let selectedRangeStart=(CanranCore.homeCatalog.rangeForLesson(recommendation?.lesson)||CanranCore.homeCatalog.RANGES[2]).start;

function progressAction(course){
  if(course.max > 0 && course.stars >= course.max) return '再次挑战';
  if(course.stars > 0) return '继续冒险';
  return '开始冒险';
}

function progressPercent(course){
  return course.max > 0 ? Math.max(0,Math.min(100,course.stars/course.max*100)) : 0;
}

function featureMarkup(features){
  return features.map(feature=>`<li>${feature}</li>`).join('');
}

function renderContinue(){
  if(!recommendation){continuePanel.hidden=true;return;}
  continuePanel.innerHTML=`
    <h2 class="sr-only" id="continueTitle">继续学习</h2>
    <form class="continue-card" id="continueCourse" action="${recommendation.route}" method="get" data-route="${recommendation.route}">
      <div class="continue-art"><img src="${recommendation.art}" alt="${recommendation.title}课程插画" width="190" height="190"></div>
      <div class="continue-copy">
        <span class="ribbon">${recommendation.stars >= recommendation.max ? '再次挑战' : '继续学习'}</span>
        <p class="eyebrow">Lesson ${recommendation.lesson} · 第一册</p>
        <h2>${recommendation.title}</h2>
        <p class="subtitle">${recommendation.subtitle}</p>
        <p class="summary">${recommendation.description}</p>
        <ul class="feature-list">${featureMarkup(recommendation.features)}</ul>
        <div class="progress-row">
          <div class="progress-track" role="progressbar" aria-label="Lesson ${recommendation.lesson} 学习进度" aria-valuemin="0" aria-valuemax="${recommendation.max}" aria-valuenow="${recommendation.stars}"><span class="progress-fill" style="width:${progressPercent(recommendation)}%"></span></div>
          <span class="progress-label">星 ${recommendation.stars}/${recommendation.max}</span>
          <button class="primary-action" type="submit">${progressAction(recommendation)}</button>
        </div>
      </div>
    </form>`;
}

function renderRanges(start){
  rangeTickets.innerHTML=CanranCore.homeCatalog.RANGES.map(range=>`
    <button class="range-ticket" type="button" data-range-start="${range.start}" aria-pressed="${range.start===start}">${range.start}–${range.end}</button>
  `).join('');
  const index=CanranCore.homeCatalog.RANGES.findIndex(range=>range.start===start);
  previousRange.disabled=index<=0;
  nextRange.disabled=index<0||index>=CanranCore.homeCatalog.RANGES.length-1;
  rangeTickets.querySelectorAll('[data-range-start]').forEach(button=>{
    button.addEventListener('click',()=>selectRange(Number(button.dataset.rangeStart)));
  });
  rangeTickets.querySelector('[aria-pressed="true"]')?.scrollIntoView({block:'nearest',inline:'center'});
}

function stationMarkup(course){
  if(!course.route){
    return `<article class="station soon" data-lesson="${course.lesson}" tabindex="-1">
      <span class="station-band">Lesson ${course.lesson}</span>
      <div class="soon-message"><div><span class="soon-number">${course.lesson}</span><strong>即将开放</strong></div></div>
    </article>`;
  }
  const progressId=`pt${course.lesson}`;
  return `<a class="station" data-tone="${course.tone}" data-lesson="${course.lesson}" href="${course.route}">
    <span class="station-band">Lesson ${course.lesson}</span>
    <span class="station-art"><img src="${course.art}" alt="" width="108" height="100"></span>
    <h3>${course.title}</h3>
    <span class="station-subtitle">${course.subtitle}</span>
    <span class="station-progress">星 <span id="${progressId}">${course.stars}</span>/${course.max}</span>
    <span class="station-action">${progressAction(course)}</span>
  </a>`;
}

function renderLessonRange(start){
  const range=CanranCore.homeCatalog.RANGES.find(candidate=>candidate.start===start);
  const courses=hydratedCourses.filter(course=>course.kind==='lesson'&&course.lesson>=range.start&&course.lesson<=range.end);
  lessonStations.innerHTML=courses.map(stationMarkup).join('');
  routeEmpty.hidden=courses.length>0;
  lessonStations.hidden=courses.length===0;
}

function selectRange(start,focusLesson=null){
  if(!CanranCore.homeCatalog.RANGES.some(range=>range.start===start)) return;
  selectedRangeStart=start;
  renderRanges(start);
  renderLessonRange(start);
  if(focusLesson!==null){
    requestAnimationFrame(()=>{
      const station=document.querySelector(`[data-lesson="${focusLesson}"]`);
      if(station) station.focus();
    });
  }
}

function handleLessonSearch(event){
  event.preventDefault();
  const result=CanranCore.homeCatalog.resolveLessonSearch(lessonSearch.value,hydratedCourses);
  if(result.status==='invalid'){
    lessonSearchStatus.textContent='请输入 1–144 的 Lesson 编号。';
    return;
  }
  selectRange(result.range.start,result.status==='available'||result.status==='placeholder'?result.lesson:null);
  lessonSearchStatus.textContent=result.status==='missing'
    ?`Lesson ${result.lesson} 还未加入目录。`
    :`已定位到 Lesson ${result.lesson}。`;
}

function renderSpecials(){
  const special=hydratedCourses.find(course=>course.kind==='special');
  if(!special) return;
  document.getElementById('specialCourses').innerHTML=`
    <a class="special-card" href="${special.route}">
      <div class="special-art"><img src="${special.art}" alt="${special.title}课程插画" width="190" height="150"></div>
      <div class="special-copy">
        <p class="eyebrow">番外篇 · 音标系列</p>
        <h3>${special.title}</h3>
        <p class="subtitle">${special.subtitle}</p>
        <p class="summary">${special.description}</p>
        <ul class="feature-list">${featureMarkup(special.features)}</ul>
        <div class="progress-row">
          <div class="progress-track" role="progressbar" aria-label="音标魔法乐园学习进度" aria-valuemin="0" aria-valuemax="${special.max}" aria-valuenow="${special.stars}"><span class="progress-fill" style="width:${progressPercent(special)}%"></span></div>
          <span class="progress-label">星 <span id="ptSM">${special.stars}</span>/${special.max}</span>
          <span class="primary-action">${progressAction(special)}</span>
        </div>
      </div>
    </a>`;
}

previousRange.addEventListener('click',()=>{
  const index=CanranCore.homeCatalog.RANGES.findIndex(range=>range.start===selectedRangeStart);
  if(index>0) selectRange(CanranCore.homeCatalog.RANGES[index-1].start);
});
nextRange.addEventListener('click',()=>{
  const index=CanranCore.homeCatalog.RANGES.findIndex(range=>range.start===selectedRangeStart);
  if(index<CanranCore.homeCatalog.RANGES.length-1) selectRange(CanranCore.homeCatalog.RANGES[index+1].start);
});
document.getElementById('lessonSearchForm').addEventListener('submit',handleLessonSearch);

renderContinue();
selectRange(selectedRangeStart);
renderSpecials();
</script>
</body>
</html>
