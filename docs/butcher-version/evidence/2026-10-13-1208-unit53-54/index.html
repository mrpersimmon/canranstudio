<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 53–54 · 设计验收画面</title><style>body{margin:0;background:#f8faf4;color:#49382d;font:16px/1.7 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:32px 20px}h1{font-size:30px}h2{margin-top:44px;font-size:22px}p{max-width:800px}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}figure{margin:0;background:#fffdfa;padding:14px;border:1px solid #d0d7be;border-radius:20px}img{display:block;max-width:100%;height:auto;margin:auto}figcaption{padding:12px 4px 4px;color:#6b6556}a{color:#527047}.mobile img{max-width:340px}.wide{grid-column:1/-1}@media(max-width:680px){section{grid-template-columns:1fr}main{padding:20px 12px}}</style><main><h1>Lesson 53–54 · 天气观察站</h1><p>无英语配音，42张词卡、完整8轮课文、69题、五个答题区和五颗星。语法依据同步导学的 like 用法，先看短示范，再独立运用。</p><p>下面是实际页面截图。小禾为独立测试账号；不代表线上学生成绩。<a href="verification.md">验收范围与边界</a>。</p><h2>人物、场景与长句</h2><section><figure class="wide"><img src="story-1280.png" alt="桌面天气小剧场，Jim介绍四方天气"><figcaption>人物相向且完整；对白和天气板都在场景内。</figcaption></figure><figure class="mobile"><img src="story-390.png" alt="390宽的小剧场"><figcaption>手机：历史对白内部滚动，人物和操作区稳定。</figcaption></figure><figure class="mobile"><img src="story-long-320.png" alt="320宽最长对白与中文"><figcaption>最长原文和中文可以完整向上回看，不截掉句子。</figcaption></figure></section><h2>以练促学与固定三卡</h2><section><figure><img src="grammar-guided.png" alt="有短示范的语法练习"><figcaption>短示范与当前题错开。</figcaption></figure><figure><img src="grammar-independent.png" alt="撤去示范的独立练习"><figcaption>末段撤去示范；综合挑战再换材料运用。</figcaption></figure><figure class="mobile"><img src="completion-320.png" alt="320宽语法完成页"><figcaption>固定连续答对、本次答对、本次答错；再练和下一站集中成组。</figcaption></figure></section><h2>同姓名、同星数，和认可样板对照</h2><section><figure><img src="compare-1-2.png" alt="小禾一星Lesson1–2"><figcaption>Lesson1–2认可样板</figcaption></figure><figure><img src="compare-3-4.png" alt="小禾一星Lesson3–4"><figcaption>Lesson3–4认可样板</figcaption></figure><figure><img src="compare-5-6.png" alt="小禾一星Lesson5–6"><figcaption>Lesson5–6认可样板</figcaption></figure><figure><img src="compare-53-54.png" alt="小禾一星Lesson53–54"><figcaption>53–54：场景、人物、道具来自本课，字体和卡面层级共用。</figcaption></figure></section><h2>真实账号、纪念册与导出</h2><section><figure><img src="five-star-card.png" alt="五星页面"><figcaption>五区实际完成后同步，不是注入星数。</figcaption></figure><figure><img src="book-card.png" alt="纪念册放大卡片"><figcaption>同一姓名和星数进入纪念册。</figcaption></figure><figure><img src="gif-frame.png" alt="实际下载动图的第15帧"><figcaption><a href="five-stars.gif">实际导出的循环动图</a>：984×528、60帧；文字与星光独立。</figcaption></figure><figure class="mobile"><img src="long-name-320.png" alt="长姓名窄屏纪念卡"><figcaption>320宽，长姓名不裁切。</figcaption></figure></section></main></html>
