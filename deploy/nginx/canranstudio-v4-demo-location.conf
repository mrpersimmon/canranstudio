# Include this file inside the canonical HTTPS server only.
# It exposes the isolated V4 artifact below /v4-demo/ without changing the production root.
location = /v4-demo {
    return 308 /v4-demo/;
}

# Keep catalog route validation canonical. Map-only review links intentionally open the
# currently published course pages, while every demo progress key remains namespaced.
location = /v4-demo/core/course-catalog.js {
    alias /var/www/canranstudio-v4-demo/current/core/course-catalog.js;
    sub_filter_once off;
    sub_filter_types application/javascript;
    # Only the catalog's generated state-image URL is root-relative. Prefixing its
    # lone `return `/...` expression keeps published lesson routes canonical.
    sub_filter 'return `/' 'return `/v4-demo/';
    sub_filter 'canran:' 'canran:v4-demo:';
    sub_filter 'l49-stars-v1' 'v4-demo:l49-stars-v1';
    sub_filter 'l50-stars-v1' 'v4-demo:l50-stars-v1';
    sub_filter 'l51-stars-v1' 'v4-demo:l51-stars-v1';
    sub_filter 'phonics-magic-stars-v1' 'v4-demo:phonics-magic-stars-v1';
}

location ^~ /v4-demo/ {
    alias /var/www/canranstudio-v4-demo/current/;
    index index.html;

    if ($uri ~ "/\.") {
        return 404;
    }

    sub_filter_once off;
    sub_filter_types text/css application/javascript application/json;
    sub_filter '<head>' '<head><meta name="robots" content="noindex,nofollow,noarchive">';

    # Root-relative runtime assets and course routes need the review prefix.
    sub_filter '`/' '`/v4-demo/';
    sub_filter '"/assets/' '"/v4-demo/assets/';
    sub_filter "'/assets/" "'/v4-demo/assets/";
    sub_filter '"/core/' '"/v4-demo/core/';
    sub_filter "'/core/" "'/v4-demo/core/";
    sub_filter '"/lesson49/' '"/v4-demo/lesson49/';
    sub_filter "'/lesson49/" "'/v4-demo/lesson49/";
    sub_filter '"/lesson50/' '"/v4-demo/lesson50/';
    sub_filter "'/lesson50/" "'/v4-demo/lesson50/";
    sub_filter '"/lesson51/' '"/v4-demo/lesson51/';
    sub_filter "'/lesson51/" "'/v4-demo/lesson51/";
    sub_filter '"/lesson52/' '"/v4-demo/lesson52/';
    sub_filter "'/lesson52/" "'/v4-demo/lesson52/";
    sub_filter '"/lesson53/' '"/v4-demo/lesson53/';
    sub_filter "'/lesson53/" "'/v4-demo/lesson53/";
    sub_filter '"/lesson54/' '"/v4-demo/lesson54/';
    sub_filter "'/lesson54/" "'/v4-demo/lesson54/";
    sub_filter '"/soundmark/' '"/v4-demo/soundmark/';
    sub_filter "'/soundmark/" "'/v4-demo/soundmark/";
    sub_filter '"/?' '"/v4-demo/?';
    sub_filter "'/?" "'/v4-demo/?";
    sub_filter 'href="/"' 'href="/v4-demo/"';
    sub_filter "href='/'" "href='/v4-demo/'";
    sub_filter "location.assign('/')" "location.assign('/v4-demo/')";
    sub_filter "location.replace('/" "location.replace('/v4-demo/";
    sub_filter 'url(/' 'url(/v4-demo/';

    # The review page shares the canonical HTTPS origin, so namespace device progress.
    sub_filter 'canran:' 'canran:v4-demo:';
    sub_filter 'l49-stars-v1' 'v4-demo:l49-stars-v1';
    sub_filter 'l50-stars-v1' 'v4-demo:l50-stars-v1';
    sub_filter 'l51-stars-v1' 'v4-demo:l51-stars-v1';
    sub_filter 'phonics-magic-stars-v1' 'v4-demo:phonics-magic-stars-v1';
}
