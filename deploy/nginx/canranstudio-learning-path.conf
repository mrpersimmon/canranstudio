# Replaces the observed /etc/nginx/conf.d/lesson49.conf for the public domain.
# Older releases stay on disk for rollback but have no location in this server.
server_tokens off;

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name canranstudio.cn www.canranstudio.cn _;

    ssl_certificate /etc/letsencrypt/live/canranstudio.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canranstudio.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/canranstudio-learning-path/current;
    index index.html;
    charset utf-8;
    absolute_redirect off;
    open_file_cache off;
    autoindex off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = / { try_files /index.html =404; }
    location = /release-manifest.json { return 404; }
    location ~ /\. { return 404; }
    # Every old HTML page and directory entry goes to the one current course.
    location ~ (?:/|\.html?)$ { return 302 /; }
    location / { try_files $uri @retired; }
    location @retired {
        if ($uri ~ "\.[a-zA-Z0-9]{1,8}$") { return 404; }
        return 302 /;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name canranstudio.cn www.canranstudio.cn _;
    return 301 https://www.canranstudio.cn$request_uri;
}
