# Isolated public review host for the V4 golden route page.
# This server never changes /var/www/canranstudio/current or the production host.
server {
    listen 80;
    listen [::]:80;
    server_name v4.59-110-217-36.nip.io;

    root /var/www/canranstudio-v4-demo/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;
    server_name_in_redirect off;
    open_file_cache off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-cache" always;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /home {
        return 308 /;
    }

    location = /home/ {
        return 308 /;
    }

    location = /home/index.html {
        return 308 /;
    }

    location / {
        try_files $uri $uri/ =404;
        limit_except GET HEAD {
            deny all;
        }
    }

    location ~ /\. {
        deny all;
    }
}
