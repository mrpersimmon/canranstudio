# canranstudio public HTTP contract.
# HTTPS/HSTS are intentionally absent while the accepted HTTP-only deployment remains in force.
server {
    listen 80;
    listen [::]:80;
    server_name 59.110.217.36;

    root /var/www/canranstudio/current;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;
    open_file_cache off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-cache" always;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /home {
        return 308 /;
    }

    location = /home/ {
        return 308 /;
    }

    location = /home/index.html {
        return 308 /;
    }

    location = /lesson49 {
        return 308 /lesson49/;
    }

    location = /lesson50 {
        return 308 /lesson50/;
    }

    location = /lesson51 {
        return 308 /lesson51/;
    }

    location = /lesson54 {
        return 308 /lesson54/;
    }

    location = /soundmark {
        return 308 /soundmark/;
    }

    location / {
        try_files $uri $uri/ =404;
        limit_except GET HEAD {
            deny all;
        }
    }

    location ~ /\. {
        deny all;
    }
}
