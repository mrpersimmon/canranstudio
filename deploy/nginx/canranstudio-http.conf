# canranstudio public HTTP endpoint — retired to HTTPS.
# Port 80 no longer serves content. Every request is redirected (301) to the
# canonical HTTPS origin at https://www.canranstudio.cn, which delivers the
# content and HSTS contract. The canonical HTTPS server block (with HSTS) is
# managed outside this repository; this server owns only the bare-IP :80 endpoint.
server {
    listen 80;
    listen [::]:80;
    server_name 59.110.217.36;

    server_tokens off;

    return 301 https://www.canranstudio.cn$request_uri;
}
