# Include this file inside the canonical HTTPS server only.
# The Lesson 1–2 review artifact remains isolated from the production release root.
# Public course routes use /poc/lesson-<first>-<last>/; the source directory name
# is an implementation detail and must never remain the browser entry URL.
location = /poc/lesson1-2-experience {
    return 308 /poc/lesson-1-2/;
}

location = /poc/lesson1-2-experience/ {
    return 308 /poc/lesson-1-2/;
}

location = /poc/lesson1-2-experience/index.html {
    return 308 /poc/lesson-1-2/;
}

location = /poc/lesson-1-2 {
    return 308 /poc/lesson-1-2/;
}

location = /poc/lesson-1-2/index.html {
    return 308 /poc/lesson-1-2/;
}

location = /poc/lesson-1-2/ {
    rewrite ^ /poc/lesson-1-2/course/index.html last;
}

location = /poc/lesson-1-2/review {
    return 308 /poc/lesson-1-2/review/;
}

location = /poc/lesson-1-2/review/index.html {
    return 308 /poc/lesson-1-2/review/;
}

location = /poc/lesson-1-2/review/ {
    rewrite ^ /poc/lesson-1-2/review-files/index.html last;
}

location ^~ /poc/lesson-1-2/assets/ {
    alias /var/www/canranstudio-lesson-1-2/current/assets/;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-cache" always;

    limit_except GET HEAD {
        deny all;
    }
}

location ^~ /poc/lesson-1-2/core/ {
    alias /var/www/canranstudio-lesson-1-2/current/core/;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/poc/lesson-1-2/" always;

    limit_except GET HEAD {
        deny all;
    }
}

location ^~ /poc/lesson-1-2/course/ {
    alias /var/www/canranstudio-lesson-1-2/current/poc/lesson1-2-experience/;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-cache" always;

    limit_except GET HEAD {
        deny all;
    }
}

location ^~ /poc/lesson-1-2/review-files/ {
    alias /var/www/canranstudio-lesson-1-2/current/poc/lesson1-2-review/;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-cache" always;

    limit_except GET HEAD {
        deny all;
    }
}

location ^~ /poc/lesson-1-2/ {
    return 404;
}
