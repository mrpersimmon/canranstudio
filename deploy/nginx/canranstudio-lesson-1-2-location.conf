# Include this file inside the canonical HTTPS server only.
# The Lesson 1–2 review artifact remains isolated from the production release root.
location = /poc/lesson-1-2 {
    return 308 /poc/lesson-1-2/;
}

location = /poc/lesson-1-2/index.html {
    return 308 /poc/lesson-1-2/;
}

location = /poc/lesson-1-2/ {
    rewrite ^ /poc/lesson-1-2/poc/lesson1-2-experience/index.html last;
}

location ^~ /poc/lesson-1-2/assets/ {
    alias /var/www/canranstudio-lesson-1-2/current/assets/;

    sub_filter_once off;
    sub_filter_types text/css application/javascript application/json;
    sub_filter '"/assets/' '"/poc/lesson-1-2/assets/';
    sub_filter "'/assets/" "'/poc/lesson-1-2/assets/";
    sub_filter 'url(/assets/' 'url(/poc/lesson-1-2/assets/';

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-cache" always;

    limit_except GET HEAD {
        deny all;
    }
}

location ^~ /poc/lesson-1-2/core/ {
    alias /var/www/canranstudio-lesson-1-2/current/core/;

    sub_filter_once off;
    sub_filter_types text/css application/javascript application/json;
    sub_filter '"/assets/' '"/poc/lesson-1-2/assets/';
    sub_filter "'/assets/" "'/poc/lesson-1-2/assets/";
    sub_filter '"/poc/lesson1-2-experience/' '"/poc/lesson-1-2/poc/lesson1-2-experience/';
    sub_filter "'/poc/lesson1-2-experience/" "'/poc/lesson-1-2/poc/lesson1-2-experience/";
    sub_filter 'poc:lesson1-2-experience:v1' 'poc:lesson-1-2-review:v1';

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-cache" always;

    limit_except GET HEAD {
        deny all;
    }
}

location ^~ /poc/lesson-1-2/poc/lesson1-2-experience/ {
    alias /var/www/canranstudio-lesson-1-2/current/poc/lesson1-2-experience/;

    sub_filter_once off;
    sub_filter_types text/css application/javascript application/json;
    sub_filter '"/assets/' '"/poc/lesson-1-2/assets/';
    sub_filter "'/assets/" "'/poc/lesson-1-2/assets/";
    sub_filter '"/core/' '"/poc/lesson-1-2/core/';
    sub_filter "'/core/" "'/poc/lesson-1-2/core/";
    sub_filter '"/poc/lesson1-2-experience/' '"/poc/lesson-1-2/poc/lesson1-2-experience/';
    sub_filter "'/poc/lesson1-2-experience/" "'/poc/lesson-1-2/poc/lesson1-2-experience/";
    sub_filter 'url(/assets/' 'url(/poc/lesson-1-2/assets/';
    sub_filter 'poc:lesson1-2-experience:v1' 'poc:lesson-1-2-review:v1';

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-cache" always;

    limit_except GET HEAD {
        deny all;
    }
}

location ^~ /poc/lesson-1-2/ {
    return 404;
}
