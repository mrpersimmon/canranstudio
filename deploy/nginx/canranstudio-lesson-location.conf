# Include inside the existing HTTPS server. Keep its root and TLS settings.
location = /lesson { return 308 /lesson/$is_args$args; }
location = /lesson/home { return 308 /lesson/$is_args$args; }
location = /lesson/home/ { return 308 /lesson/$is_args$args; }
location = /lesson/home/index.html { return 308 /lesson/$is_args$args; }

location ^~ /lesson/ {
    alias /var/www/canranstudio-lesson/current/;
    index index.html;
    autoindex off;
    if ($uri ~ "/\.") { return 404; }
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self'; connect-src 'none'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/lesson/" always;
}
