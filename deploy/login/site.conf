# Replaces the observed lesson49.conf on the authorized canonical host only.
# Unknown hosts must never select the account service or receive its certificate.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    server_tokens off;
    ssl_reject_handshake on;
    return 444;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name canranstudio.cn www.canranstudio.cn;
    server_tokens off;
    # Also reject an unrelated HTTP Host after a valid canonical TLS SNI.
    if ($host !~* ^(www\.)?canranstudio\.cn$) { return 444; }
    if ($host = canranstudio.cn) { return 308 https://www.canranstudio.cn$request_uri; }
    ssl_certificate /etc/letsencrypt/live/canranstudio.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canranstudio.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    charset utf-8;
    absolute_redirect off;
    open_file_cache off;
    autoindex off;
    include /etc/nginx/snippets/canranstudio-login-location.conf;
}
server {
    listen 80;
    listen [::]:80;
    server_name canranstudio.cn www.canranstudio.cn;
    server_tokens off;
    return 301 https://www.canranstudio.cn$request_uri;
}
