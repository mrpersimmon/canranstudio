# REPLACE the previous canranstudio-lesson-location.conf include, including
# its /lesson/resources/ and /lesson/course-packages/ alias locations.
# Include within the existing HTTPS server. Leave the main website unchanged.
location = /lesson { return 308 /lesson/$is_args$args; }
location ^~ /lesson/ {
    proxy_pass http://127.0.0.1:4182;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cache off;
    proxy_buffering off;
    client_max_body_size 1500k;
    proxy_read_timeout 35s;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # No try_files, public alias, error_page fallback or static recovery.
}
