# Sole location configuration for the canonical HTTPS server.
# Remove the previous /lesson static alias and immutable-resource aliases.
location = /exercise { return 308 /exercise/$is_args$args; }
location ^~ /exercise/ {
    alias /var/www/canranstudio-exercise/current/;
    index index.html;
    autoindex off;
    if ($uri ~ "/\.|/release-manifest\.json$") { return 404; }
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/exercise/" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
location ~ /\. { return 404; }
location / {
    proxy_pass http://127.0.0.1:4182;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cache off;
    proxy_buffering off;
    client_max_body_size 1500k;
    proxy_read_timeout 35s;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # No public fallback when the account service is unavailable.
}
